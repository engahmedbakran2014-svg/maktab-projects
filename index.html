<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="برنامج إدارة مشاريع المكتب الهندسي — ترتيب المشاريع والمهام والموافقات المبدئية">
<meta name="theme-color" content="#0F6E64">
<style>
  html,body{margin:0;padding:0}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#EDF0F2;color:#16232E}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<title>إدارة مشاريع المكتب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F8F9; --surface-3:#EAEFF1;
  --line:#D4DCE0; --line-soft:#E4EAEC;
  --ink:#16232E; --ink-2:#485B66; --ink-3:#7A8C96;
  --accent:#0F6E64; --accent-2:#0B534B; --accent-soft:#DBEAE7;
  --crit:#B0352A; --crit-soft:#F7DFDB;
  --work:#B25E0C; --work-soft:#FAE8D3;
  --warn:#8E6110; --warn-soft:#F5E9D2;
  --good:#25714A; --good-soft:#D9EEE2;
  --pause:#6C7B84; --pause-soft:#E6EAEC;
  --info:#2A5A83; --info-soft:#DDE8F1;
  --shadow:0 1px 2px rgba(22,35,46,.05), 0 10px 26px -16px rgba(22,35,46,.30);
  --r:10px;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-disp:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1417; --surface:#171F24; --surface-2:#1D262C; --surface-3:#232E35;
    --line:#2B373E; --line-soft:#222C32;
    --ink:#E2E9EC; --ink-2:#A0B0B8; --ink-3:#72848D;
    --accent:#4FAE9F; --accent-2:#6BC4B5; --accent-soft:#123430;
    --crit:#EA8474; --crit-soft:#3A201B;
    --work:#E39A4E; --work-soft:#38260F;
    --warn:#D9A94F; --warn-soft:#302512;
    --good:#6DC292; --good-soft:#143020;
    --pause:#93A4AD; --pause-soft:#242E34;
    --info:#7EB1DB; --info-soft:#122534;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1417; --surface:#171F24; --surface-2:#1D262C; --surface-3:#232E35;
  --line:#2B373E; --line-soft:#222C32;
  --ink:#E2E9EC; --ink-2:#A0B0B8; --ink-3:#72848D;
  --accent:#4FAE9F; --accent-2:#6BC4B5; --accent-soft:#123430;
  --crit:#EA8474; --crit-soft:#3A201B;
  --work:#E39A4E; --work-soft:#38260F;
  --warn:#D9A94F; --warn-soft:#302512;
  --good:#6DC292; --good-soft:#143020;
  --pause:#93A4AD; --pause-soft:#242E34;
  --info:#7EB1DB; --info-soft:#122534;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);margin:0;
  -webkit-font-smoothing:antialiased}
#app{direction:rtl;text-align:right;max-width:1180px;margin:0 auto;padding-inline:18px;padding-block:0 56px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;unicode-bidi:plaintext;display:inline-block}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--ground);
  border-bottom:1px solid var(--line);margin-inline:-18px;padding:14px 18px 12px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center;min-width:0}
.mark{width:38px;height:38px;flex:none;border-radius:9px;background:var(--accent);position:relative;overflow:hidden}
.mark::before,.mark::after{content:"";position:absolute;background:rgba(255,255,255,.5)}
.mark::before{inset:9px auto 9px 9px;width:1px;right:13px}
.mark::after{inset:auto 9px 13px 9px;height:1px}
.mark span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:600 13px/1 var(--f-num)}
.brand h1{font-size:17px;line-height:1.3}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.today{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  border-inline-start:2px solid var(--accent);padding-inline-start:11px}
.today b{font-size:13.5px;font-weight:600}
.today small{font-size:11.5px;color:var(--ink-3)}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:8px 13px;font-size:13px;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:6px 9px}
.btn.ghost:hover{background:var(--surface-3);border-color:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger:hover{background:var(--crit-soft);border-color:var(--crit)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- banners ---------- */
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:var(--r);
  padding:11px 14px;font-size:13px;margin-top:14px;border:1px solid}
.banner.alert{background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 35%,transparent);color:var(--warn)}
.banner.local{background:var(--info-soft);border-color:color-mix(in oklab,var(--info) 30%,transparent);color:var(--info)}
.banner b{font-weight:600}
.banner .spacer{flex:1}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:12px 13px 11px;text-align:right;position:relative;transition:.15s;min-width:0}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile .k{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-weight:500}
.tile .dot{width:7px;height:7px;border-radius:50%;flex:none}
.tile .v{font:600 25px/1.1 var(--f-num);margin-top:7px;letter-spacing:-.02em}
.tile .sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.t-late .dot{background:var(--crit)} .t-late .v{color:var(--crit)}
.t-today .dot{background:var(--crit)} .t-today .v{color:var(--crit)}
.t-work .dot{background:var(--work)} .t-work .v{color:var(--work)}
.t-pause .dot{background:var(--pause)} .t-pause .v{color:var(--pause)}
.t-done .dot{background:var(--good)} .t-done .v{color:var(--good)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pipnum{background:var(--crit);color:#fff;border-radius:20px;font:600 10.5px/1 var(--f-num);padding:3px 6px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px}
.toolbar input,.toolbar select{width:auto;min-width:150px;flex:0 1 auto;font-size:13px;padding:7px 10px}
.toolbar .grow{flex:1 1 190px;min-width:150px}
.toolbar .spacer{flex:1}

/* ---------- register (project list) ---------- */
.register{margin-top:14px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.reg-head{display:grid;grid-template-columns:4px 2.3fr 1fr 1.15fr 1.25fr auto;gap:14px;align-items:center;
  padding:9px 14px 9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.row{display:grid;grid-template-columns:4px 2.3fr 1fr 1.15fr 1.25fr auto;gap:14px;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--line-soft);position:relative}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.stripe{align-self:stretch;border-radius:3px;background:var(--ink-3);min-height:38px}
.row.s-late .stripe{background:var(--crit)}
.row.s-today .stripe{background:var(--crit);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 7px)}
.row.s-work .stripe{background:var(--work)}
.row.s-pause .stripe{background:var(--pause)}
.row.s-done .stripe{background:var(--good)}
.row.needs-reason{background:var(--pause-soft)}
.p-name{font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.p-meta{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code{font-family:var(--f-num);font-size:11px;color:var(--ink-2);background:var(--surface-3);
  border-radius:4px;padding:1px 5px;direction:ltr;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  border-radius:20px;padding:3px 9px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.late{background:var(--crit-soft);color:var(--crit)}
.pill.today{background:var(--crit-soft);color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit)}
.pill.work{background:var(--work-soft);color:var(--work)}
.pill.pause{background:var(--pause-soft);color:var(--pause);box-shadow:inset 0 0 0 1px var(--pause)}
.pill.soon{background:var(--info-soft);color:var(--info)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
button.pill{border:0;transition:.15s}
button.pill:hover{filter:brightness(.96);box-shadow:inset 0 0 0 1px currentColor}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.av{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;
  font:600 11px/1 var(--f-body);background:var(--accent-soft);color:var(--accent)}
.av.mgr{background:var(--info-soft);color:var(--info)}
.who b{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:11px;color:var(--ink-3);font-family:var(--f-num);unicode-bidi:plaintext;display:block}
.due b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;display:block}
.due small{font-size:11.5px;color:var(--ink-3);display:block;margin-top:2px}
.due .pill{max-width:100%;flex-wrap:nowrap}
.prog{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:7px;max-width:150px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.acts{display:flex;gap:4px;align-items:center}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:8px}
.empty .btn{margin-top:14px}

/* ---------- timeline ---------- */
.tl-day{margin-top:20px}
.tl-hd{display:flex;gap:10px;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tl-hd b{font-family:var(--f-disp);font-size:14px}
.tl-hd .dnum{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl-hd .tag{margin-inline-start:auto;font-size:11px}
.tl-day.is-today .tl-hd{border-bottom-color:var(--accent)}
.tl-day.is-today .tl-hd b{color:var(--accent)}
.tl-items{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border-radius:var(--r);
  overflow:hidden;margin-top:10px;border:1px solid var(--line-soft)}
.tl-item{background:var(--surface);padding:11px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tl-item .p-name{flex:1 1 220px;min-width:0}

/* ---------- notes ---------- */
.note{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.note.unread{border-color:color-mix(in oklab,var(--crit) 45%,transparent);background:var(--crit-soft)}
.note-hd{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.note-hd b{color:var(--ink);font-size:13px}
.note-body{font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.note-ft{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:14px}

/* ---------- الموافقات المبدئية ---------- */
.rev{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow)}
.rev-top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:14px 15px 12px}
.rev-top .ttl{flex:1 1 260px;min-width:0}
.rev-top .ttl b{font-size:15px;font-weight:600;display:block;line-height:1.35}
.rev-top .ttl .sub{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clock{padding:0 15px 13px}
.clock-hd{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.clock-hd b{font-size:13px;font-weight:600}
.clock-hd .spacer{flex:1}
.bar{height:9px;border-radius:6px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.bar.c-done i{background:var(--good)}
.bar.c-work i{background:var(--work)}
.bar.c-late i{background:var(--crit);width:100%!important}
.bar.c-pause i{background:var(--pause)}
.bar .ticks{position:absolute;inset:0;display:flex;pointer-events:none}
.bar .ticks span{flex:1;border-inline-start:1px solid var(--surface);opacity:.55}
.bar .ticks span:first-child{border:0}
.rev-body{padding:0 15px 13px;display:flex;flex-direction:column;gap:11px}
.rmk{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:11px 13px;
  font-size:13.5px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.rmk .lbl{font-size:11px;font-weight:600;color:var(--ink-3);display:block;margin-bottom:5px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:78px;height:78px;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2);display:block;position:relative;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;inset-inline-end:2px;background:var(--crit);color:#fff;border:0;
  border-radius:5px;width:19px;height:19px;font-size:12px;line-height:1;display:grid;place-items:center}
.rev-ft{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:11px 15px;
  background:var(--surface-2);border-top:1px solid var(--line-soft)}
.rev-ft .spacer{flex:1}
.track{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.7;
  background:var(--info-soft);border-color:color-mix(in oklab,var(--info) 28%,transparent);color:var(--ink-2)}
.track b{color:var(--info)}
.grp-hd{display:flex;gap:10px;align-items:center;margin-top:20px;padding-bottom:8px;
  border-bottom:2px solid var(--accent)}
.grp-hd .av{width:26px;height:26px;font-size:10.5px;border-radius:7px}
.grp-hd b{font-family:var(--f-disp);font-size:14px}
.grp-hd .spacer{flex:1}
.star{border:0;background:none;padding:0 2px;font-size:14px;line-height:1;color:var(--ink-3);cursor:pointer}
.star.on{color:var(--work)}
.upload-lbl{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);
  border-radius:8px;padding:9px 13px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.upload-lbl:hover{border-color:var(--accent);color:var(--accent)}
.upload-lbl input{display:none}

/* ---------- جدول الأعمال ---------- */
.tasktable{border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.tt-row{display:grid;grid-template-columns:1.7fr 1.05fr 1.1fr .95fr;gap:12px;align-items:center;
  padding:10px 13px;border-bottom:1px solid var(--line-soft);border-inline-start:4px solid transparent}
.tt-row.tt-5{grid-template-columns:1.3fr 1.5fr 1fr 1fr .9fr}
.tt-row:last-child{border-bottom:0}
.tt-head{background:var(--surface-2);font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.tt-row.st-done{border-inline-start-color:var(--good);background:color-mix(in oklab,var(--good-soft) 55%,transparent)}
.tt-row.st-work{border-inline-start-color:var(--work)}
.tt-row.st-soon{border-inline-start-color:var(--info);background:color-mix(in oklab,var(--info-soft) 55%,transparent)}
.tt-row.st-pause{border-inline-start-color:var(--pause)}
.tt-name{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.tt-row .pill{justify-self:start}
.tt-row select{max-width:150px}

/* ---------- متطلبات بلدي ---------- */
.reqwrap{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:var(--surface-2)}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:4px}
.req{display:flex;align-items:center;gap:9px;text-align:right;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;transition:.15s}
.req:hover:not(:disabled){border-color:var(--accent)}
.req .box{width:19px;height:19px;flex:none;border-radius:5px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.req.on{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.req.on .box{background:var(--good);border-color:var(--good)}
.req:disabled{opacity:.75;cursor:default}

/* ---------- صفحة المسؤول ---------- */
.desk-hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px 15px;box-shadow:var(--shadow)}
.folderbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px;
  border:1px dashed var(--line);border-radius:var(--r);padding:13px 15px;background:var(--surface-2)}
.folderbar b{font-size:13.5px;flex:0 0 auto}
.folderbar .spacer{flex:1}
/* ---------- متطلبات العميل ---------- */
.filechip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;max-width:100%}
.filechip a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip a:hover{text-decoration:underline}

  auditBuf.push({at:Date.now(),by:meId,byName:(m&&m.name)||"",role:(m&&m.role)||"",
    act:act,ent:coll,eid:id,label:label||"",det:det||""});
  clearTimeout(auditTimer); auditTimer=setTimeout(flushAudit,700);
}
async function flushAudit(){
  if(!auditBuf.length) return;
  var items=auditBuf.splice(0), day=iso(today());
  var list=[];
  if(DB){
    try{ var d=await DB.collection("audit").doc(day).get();
      var ex=(typeof d.exists==="function")?d.exists():d.exists;
      if(ex) list=((d.data()||{}).items||[]).slice(); }catch(e){}
  } else list=((AUDIT[day]||{}).items||[]).slice();
  list=list.concat(items);
  if(list.length>500) list=list.slice(-500);
  AUDIT[day]={date:day,items:list,updatedAt:Date.now()};
  if(DB){ DB.collection("audit").doc(day).set({date:day,items:list,updatedAt:Date.now()}).catch(function(){}); }
  else saveLocal();
}

function put(coll,id,data,quiet){
  var old=S[coll][id];
  S[coll][id]=Object.assign({},data,{id:id});
  render();
  if(!quiet) audit(old?"تعديل":"إضافة",coll,id,labelOf(coll,id,data),
    old?diffFields(old,data):"");
  if(DB){ return DB.collection(coll).doc(id).set(data).catch(dbErr); }
  saveLocal(); return Promise.resolve();
}
function patch(coll,id,data,quiet){
  var cur=S[coll][id]||{};
  return put(coll,id,Object.assign({},cur,data),quiet);
}
function remove(coll,id,quiet){
  if(!quiet) audit("حذف",coll,id,labelOf(coll,id),"");
  delete S[coll][id]; render();
  if(DB){ return DB.collection(coll).doc(id).delete().catch(dbErr); }
  saveLocal(); return Promise.resolve();
}
function dbErr(e){
  var c=e&&e.code;
  var msg = c==="quota_exceeded" ? "امتلأت مساحة قاعدة البيانات — احذف مشاريع أو ملاحظات قديمة."
        : c==="resource_exhausted" ? "عدد كبير من العمليات في وقت واحد — انتظر لحظة وأعد المحاولة."
        : c==="invalid_argument" ? "لا تملك صلاحية هذا التعديل أو أن البيانات غير صحيحة."
        : "تعذّر حفظ التغيير على الخادم — تحقق من الاتصال وأعد المحاولة.";
  toast(msg,true);
}
function watch(coll){
  return DB.collection(coll).onSnapshot(function(snap){
    var m={};

    S[coll]=m; render();

/* ---- تشغيل خارج claude.ai (مثل GitHub Pages) عبر Firebase اختياري ---- */

    var s=document.createElement("script"); s.src=src; s.async=true;
    s.onload=res; s.onerror=function(){rej(new Error("load "+src));};
    document.head.appendChild(s);
  });
}
var FBV="10.12.2";

function fbAssets(){

    upload:function(file){

        String(file.name||"file").replace(/[^\w.\-]/g,"_");
      var ref=st.ref(name);
      return ref.put(file).then(function(){ return ref.getDownloadURL(); })
        .then(function(url){ return {id:name,url:url,sizeBytes:file.size,contentType:file.type}; });
    },
    list:function(){ return Promise.resolve({assets:[],usage:{files:0,bytes:0,maxFiles:0,maxBytes:0}}); },
    "delete":function(ref){ return st.ref(ref).delete().then(function(){return {deleted:true};},

}

function wsOf(p){
  if(p.workState) return p.workState;
  return p.stage==="مكتمل"?"مكتمل":"قيد العمل";

/* لون الحالة: أحمر = متأخر أو لم يُستكمل في وقته · برتقالي = قيد العمل
   أخضر = مكتمل · رمادي = متوقف حتى يُذكر السبب */
function statusOf(p){
  var ws=wsOf(p);
  if(ws==="متوقف"){
    var r=(p.pauseReason||"").trim();
    return {k:"paused",cls:"pause",label:"متوقف",sub:r?"بسبب مسجّل":"أضف السبب",needReason:!r,reason:r};
  }
  if(ws==="مكتمل"||p.stage==="مكتمل"){
    var lateDone=false;
    if(p.completedAt&&p.dueDate){ var c=new Date(p.completedAt); c.setHours(0,0,0,0);
      lateDone=c>parseD(p.dueDate); }
    return {k:"done",cls:"done",label:"مكتمل",sub:lateDone?"سُلّم متأخراً":"في وقته"};
  }
  var d=diffDays(p.dueDate);
  if(d===null) return {k:"work",cls:"work",label:"قيد العمل",sub:"بلا موعد"};
  if(d<0) return {k:"late",cls:"late",label:"متأخر "+Math.abs(d)+" يوم",sub:"لم يُستكمل في وقته",n:Math.abs(d)};
  if(d===0) return {k:"today",cls:"today",label:"يستحق اليوم",sub:"آخر يوم",n:0};
  return {k:"work",cls:"work",label:"قيد العمل",sub:"بعد "+d+" يوم",n:d};
}

function revList(){
  var a=[]; for(var k in S.reviews) a.push(S.reviews[k]);
  if(!isRoot()) a=a.filter(function(r){ return canSeeProject(S.projects[r.projectId]); });
  a.sort(function(x,y){
    var rx=revClock(x), ry=revClock(y);
    if(rx.closed!==ry.closed) return rx.closed?1:-1;
    return (rx.left===null?9999:rx.left)-(ry.left===null?9999:ry.left);
  });
  return a;
}
function revsFor(pid){ return revList().filter(function(r){return r.projectId===pid;}); }
/* الشريط: يبدأ أخضر يوم تسجيل الملاحظة وينتهي أحمر عند انتهاء الفترة المقدرة */
function revClock(r){
  var closed = r.status==="موافقة مبدئية"||r.status==="مرفوضة"||r.status==="أُعيد الإرسال";
  var start = r.remarkDate||null;
  var win = Number(r.windowDays)||DEF_WINDOW;
  if(!start) return {closed:closed,left:null,pct:0,cls:closed?"done":"pause",
    label:closed?"مغلقة":"بانتظار نزول الملاحظات من الجهة"};
  var sd=parseD(start); if(!sd) return {closed:closed,left:null,pct:0,cls:"pause",label:"—"};
  var used=Math.round((today()-sd)/86400000);
  var left=win-used;
  var pct=Math.max(0,Math.min(100,Math.round((left/win)*100)));
  if(closed) return {closed:true,left:left,pct:100,win:win,used:used,
    cls:r.status==="مرفوضة"?"late":(r.status==="أُعيد الإرسال"?"pause":"done"),
    label:r.status==="مرفوضة"?"مرفوضة":(r.status==="أُعيد الإرسال"?"أُعيدت للجهة":"معتمدة مبدئياً")};
  var cls = left<=0?"late":(left<=3?"work":"done");
  var label = left<0 ? "تجاوز المهلة بـ "+Math.abs(left)+" يوم"
    : left===0 ? "اليوم آخر يوم للإرسال"
    : "متبقٍ "+left+" يوم من "+win;
  return {closed:false,left:left,pct:pct,cls:cls,win:win,used:used,label:label};
}
function revExpired(){ return revList().filter(function(r){ var c=revClock(r);
  return !c.closed && c.left!==null && c.left<=0; }); }

async function saveFile(filename,text,mime){
  var dl=null;
  try{ dl = window.claude&&window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(dl){
    try{ await dl.save({filename:filename,data:text}); toast("تم حفظ الملف: "+filename); return true; }
    catch(e){
      var c=e&&e.code;
      if(c==="declined"||c==="cancelled"){ toast("أُلغي الحفظ"); return false; }
      if(c==="rate_limited"){ toast("نافذة حفظ أخرى مفتوحة — أكملها ثم أعد المحاولة",true); return false; }
      if(c==="rejected_extension"||c==="extension_not_enabled"){
        toast("صيغة الملف غير مسموح بحفظها هنا",true); return false; }
    }
  }
  try{
    var b=(text instanceof Blob)?text:new Blob([text],{type:mime||"application/json;charset=utf-8"});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a"); a.href=u; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},4000);
    toast("تم حفظ الملف: "+filename);
    return true;
  }catch(e){ toast("تعذّر حفظ الملف على هذا الجهاز",true); return false; }
}

/* --- كاتب ملفات ZIP مدمج (لا يعتمد على أي مكتبة خارجية) --- */
function crc32(u8){
  var t=crc32.t;
  if(!t){ t=crc32.t=new Int32Array(256);
    for(var n=0;n<256;n++){ var c=n;
      for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      t[n]=c; } }
  var r=-1;
  for(var i=0;i<u8.length;i++) r=(r>>>8)^t[(r^u8[i])&255];
  return (r^-1)>>>0;
}
async function toU8(d){
  if(typeof d==="string") return new TextEncoder().encode(d);
  if(d instanceof Uint8Array) return d;
  if(d instanceof ArrayBuffer) return new Uint8Array(d);
  if(d && typeof d.arrayBuffer==="function") return new Uint8Array(await d.arrayBuffer());
  return new TextEncoder().encode(String(d));
}
async function makeZip(entries){
  var enc=new TextEncoder(), local=[], central=[], offset=0, now=new Date();
  var tm=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
  var dt=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  for(var i=0;i<entries.length;i++){
    var data=await toU8(entries[i].data);
    var name=enc.encode(entries[i].name);
    var crc=crc32(data);
    var lh=new Uint8Array(30+name.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint16(8,0,true); lv.setUint16(10,tm,true); lv.setUint16(12,dt,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true); lv.setUint16(28,0,true);
    lh.set(name,30);
    local.push(lh,data);
    var ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true);
    cv.setUint16(12,tm,true); cv.setUint16(14,dt,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true);
    cv.setUint32(42,offset,true);
    ch.set(name,46);
    central.push(ch);
    offset+=lh.length+data.length;
  }
  var cdSize=0; central.forEach(function(c){cdSize+=c.length;});
  var end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true); ev.setUint16(20,0,true);
  return new Blob(local.concat(central,[end]),{type:"application/zip"});
}

/* شاشة الحفظ: تُظهر كل خطوة وسبب أي تعثّر */
function saveDialog(title){
  var listEl=el("div",{class:"savelog"});
  var footEl=el("div",{class:"m-ft"},[el("button",{class:"btn",text:"إغلاق",onclick:closeModal})]);
  var node=el("div",{class:"modal",role:"dialog","aria-modal":"true"},[
    el("div",{class:"m-hd"},[el("h2",{text:title}),
      el("button",{class:"btn ghost",text:"✕",onclick:closeModal})]),
    el("div",{class:"m-bd"},[listEl]), footEl
  ]);
  openModal(node);
  return {
    step:function(txt,kind){
      listEl.appendChild(el("div",{class:"sl "+(kind||"")},[
        el("span",{class:"ic",text:kind==="bad"?"✕":kind==="ok"?"✓":"•"}),
        el("span",{text:txt})]));
      listEl.scrollTop=listEl.scrollHeight;
    },
    actions:function(kids){ footEl.innerHTML=""; kids.concat([
      el("button",{class:"btn",text:"إغلاق",onclick:closeModal})]).forEach(function(k){
      if(k) footEl.appendChild(k); }); }
  };
}
async function writeToDir(root,files,ui){
  for(var i=0;i<files.length;i++){
    var parts=files[i].name.split("/"), dir=root;
    for(var k=0;k<parts.length-1;k++) dir=await dir.getDirectoryHandle(parts[k],{create:true});
    var fh=await dir.getFileHandle(parts[parts.length-1],{create:true});
    var w=await fh.createWritable(); await w.write(files[i].blob); await w.close();
    if(ui) ui.step("كُتب: "+files[i].name,"ok");
  }
}
async function saveProjectFolder(p,ui,silent){
  ui=ui||(silent?null:saveDialog("حفظ ملف المشروع — "+p.name));
  var folder=projFolderName(p);
  var files;
  if(ui) ui.step("تجهيز ملفات المجلد: "+folder);
  try{ files=await buildProjectFiles(p); }
  catch(e){ if(ui) ui.step("تعذّر تجهيز الملفات: "+(e&&e.message||e),"bad"); return false; }
  if(!files.length){ if(ui) ui.step("لا توجد بيانات كافية لبناء الملف","bad"); return false; }
  if(ui) ui.step("جاهز: "+files.length+" ملف","ok");

  if(DIRH){
    try{
      var perm=DIRH.queryPermission?await DIRH.queryPermission({mode:"readwrite"}):"granted";
      if(perm!=="granted"&&DIRH.requestPermission) perm=await DIRH.requestPermission({mode:"readwrite"});
      if(perm==="granted"){
        var root=await DIRH.getDirectoryHandle(folder,{create:true});
        await writeToDir(root,files,ui);
        patch("projects",p.id,{folderName:folder,folderSavedAt:Date.now()});
        if(ui){ ui.step("حُفظ المجلد داخل: "+DIRNAME,"ok");
          ui.actions([el("button",{class:"btn primary",text:"معاينة الملف",onclick:function(){previewProject(p);}})]); }
        return true;
      }
      if(ui) ui.step("لم تُمنح صلاحية الكتابة في المجلد — سيُحفظ ملف مضغوط","bad");
    }catch(e){ if(ui) ui.step("تعذّرت الكتابة في المجلد ("+(e&&e.name||"خطأ")+") — سيُحفظ ملف مضغوط","bad"); }
  } else if(ui) ui.step("لم يُحدَّد مجلد على الجهاز — سيُحفظ ملف مضغوط تفكّه في المكان الذي تريد");

  var entries=files.map(function(x){ return {name:folder+"/"+x.name,data:x.blob}; });
  var blob=await makeZip(entries);
  if(ui) ui.step("حُزم المجلد ("+Math.round(blob.size/1024)+" ك.ب) — أكّد الحفظ من نافذة المتصفح");
  var okSave=await saveFile(folder+".zip",blob,"application/zip");
  if(ui){
    if(okSave) ui.step("تم حفظ "+folder+".zip على جهازك","ok");
    else ui.step("لم يكتمل الحفظ — أعد المحاولة أو استخدم «معاينة الملف» ثم طباعته","bad");
    ui.actions([el("button",{class:"btn primary",text:"معاينة الملف",onclick:function(){previewProject(p);}})]);
  }
  patch("projects",p.id,{folderName:folder,folderSavedAt:Date.now()});
  return okSave;
}
async function saveAllFolders(list){
  var ui=saveDialog("حفظ ملفات "+list.length+" مشروع");
  if(DIRH){
    for(var i=0;i<list.length;i++){ ui.step("— "+list[i].name);
      await saveProjectFolder(list[i],ui); }
    ui.step("انتهى حفظ "+list.length+" مجلد داخل "+DIRNAME,"ok");
    return;
  }
  ui.step("تجهيز مجلدات المشاريع في ملف مضغوط واحد…");
  var entries=[];
  for(var j=0;j<list.length;j++){
    try{
      var fl=await buildProjectFiles(list[j]);
      var fn=projFolderName(list[j]);
      fl.forEach(function(x){ entries.push({name:fn+"/"+x.name,data:x.blob}); });
      ui.step(fn+" — "+fl.length+" ملف","ok");
    }catch(e){ ui.step("تعذّر تجهيز: "+list[j].name,"bad"); }
  }
  if(!entries.length){ ui.step("لا توجد ملفات للحفظ","bad"); return; }
  var blob=await makeZip(entries);
  ui.step("الحجم: "+Math.round(blob.size/1024)+" ك.ب — أكّد الحفظ من نافذة المتصفح");
  var ok=await saveFile("مشاريع المكتب "+iso(today())+".zip",blob,"application/zip");
  ui.step(ok?"تم حفظ الملف المضغوط على جهازك":"لم يكتمل الحفظ — أعد المحاولة",ok?"ok":"bad");
}

function reqReady(p){

function importJSON(){
  var f=el("input",{id:"impFile",type:"file",accept:".json,application/json"});
  var info=el("div",{class:"hint",text:"لم يُختر ملف بعد."});
  var data=null;
  f.addEventListener("change",function(){
    var file=f.files&&f.files[0]; if(!file) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        if(!o||typeof o!=="object"||!o.projects) throw new Error("bad");
        data=o;
        info.textContent="الملف يحتوي "+Object.keys(o.projects||{}).length+" مشروع و "+
          Object.keys(o.staff||{}).length+" موظف و "+Object.keys(o.notes||{}).length+" ملاحظة.";
      }catch(e){ data=null; info.textContent="الملف غير صالح — اختر ملف نسخة احتياطية صادر من البرنامج."; }
    };
    r.readAsText(file);
  });
  openModal(modal("استعادة نسخة احتياطية",[
    el("p",{style:"margin:0;font-size:13px;line-height:1.8;color:var(--ink-2)",
      text:"تُضاف السجلات الموجودة في الملف إلى القائمة الحالية، ويُستبدل أي سجل يحمل نفس المعرّف. لا يُحذف شيء."}),
    field("ملف النسخة الاحتياطية (.json)",f,null,true), info
  ],[
    el("button",{class:"btn primary",text:"استعادة",onclick:function(){
      if(!data) return toast("اختر ملفاً صالحاً أولاً",true);
      var n=0;
      ["staff","projects","notes","reviews","logs","orders","briefs"].forEach(function(c){
        var src=data[c]||{};
        for(var k in src){ var row=src[k]; if(!row||typeof row!=="object") continue;
          delete row.id; put(c,k,row); n++; }
      });

function alertReview(r){
  var p=S.projects[r.projectId];
  if(!p) return toast("المشروع غير موجود",true);
  var c=revClock(r);
  var lines=[];
  lines.push("ملاحظات "+r.authority+":");
  if(r.remarkDate) lines.push("تاريخ نزول الملاحظة: "+fmtDate(r.remarkDate)+" — "+dayName(r.remarkDate));
  lines.push("المهلة المقدرة للإرسال: "+(r.windowDays||DEF_WINDOW)+" يوم ("+c.label+")");
  if(r.remarks){ lines.push(""); lines.push("نص الملاحظات:"); lines.push(r.remarks); }
  if(r.affectsDesign){ lines.push(""); lines.push("تؤثر على التصميم — الآلية: "+(r.track||"—"));
    if(r.track===TRACKS[0]) lines.push("موافقة المالك: "+(r.ownerApproval||"بانتظار الرد"));
    if(r.track===TRACKS[1]&&r.meetingAt) lines.push("موعد الاجتماع مع الجهة: "+fmtDT(r.meetingAt)); }
  if(r.fixPlan){ lines.push(""); lines.push("آلية التعديل: "+r.fixPlan); }
  if(r.images&&r.images.length) lines.push("\nمرفق "+r.images.length+" صورة من الملاحظات داخل البرنامج.");
  alertForm(p,lines.join("\n"));
}

var expiryRun=false;
function checkExpiry(){
  if(expiryRun||!isBoss()) return;
  var due=revExpired().filter(function(r){ return !r.expiryAlerted; });
  if(!due.length) return;
  expiryRun=true;
  due.forEach(function(r){
    var p=S.projects[r.projectId]; if(!p) return;
    put("notes",uid(),{projectId:p.id,kind:"alert",fromId:meId||"",toId:p.assigneeId,
      text:"انتهت المهلة المقدرة ("+(r.windowDays||DEF_WINDOW)+" يوم) للرد على ملاحظات "+r.authority+
        " الخاصة بمشروع «"+p.name+"». الرجاء استكمال التعديل وإعادة إرسال المعاملة.",
      createdAt:Date.now(),readAt:null});
    patch("reviews",r.id,{expiryAlerted:true});
  });
  toast("أُرسل تنبيه لـ"+due.length+" معاملة تجاوزت المهلة");
}

/* ===== تصدير كامل الأعمال والمشاريع (القائمة والمتوقفة) حسب الموظف ===== */
var WL={who:"all",work:true,late:true,paused:true,done:false,tasks:true};
function wlMatch(p,who){
  if(who==="all") return true;
  if(p.assigneeId===who||p.managerId===who) return true;
  if((p.team||[]).some(function(t){return t.staffId===who;})) return true;
  if((p.tasks||[]).some(function(t){return t.assigneeId===who;})) return true;
  return false;
}
function wlRows(){
  return projList().filter(function(p){
    if(!wlMatch(p,WL.who)) return false;
    var k=statusOf(p).k;
    if(k==="paused") return WL.paused;
    if(k==="done") return WL.done;
    if(k==="late"||k==="today") return WL.late;
    return WL.work;
  }).sort(sortProjects);
}
function wlProjectRow(p){
  var st=statusOf(p), a=S.staff[p.assigneeId], tk=taskList(p);
  var d=diffDays(p.dueDate);
  return {
    code:p.code||"", name:p.name||"", client:p.client||"", type:p.type||"",
    stage:p.stage||"", ws:wsOf(p),
    reason: wsOf(p)==="متوقف" ? ((p.pauseReason||"").trim()||"لم يُذكر السبب") : "—",
    status:st.label,
    lateDays:(st.k==="late"&&d!==null)?Math.abs(d):"",
    start:p.startDate||"", due:p.dueDate||"", day:p.dueDate?dayName(p.dueDate):"",
    prio:p.priority||"عادية", who:personName(p.assigneeId), phone:a?a.phone:"",
    mgr:personName(p.managerId),
    tTotal:tk.length,
    tDone:tk.filter(function(t){return t.status==="منجز";}).length,
    tWork:tk.filter(function(t){return t.status==="قيد التنفيذ";}).length,
    tNone:tk.filter(function(t){return t.status==="لم يبدأ";}).length,
    last:(projLogs(p.id)[0]||{}).date||""
  };
}

function exportWorksXLSX(){
  var head=["المهندس المسؤول","المشروع","رقم المشروع","العمل","نوع العمل","المكلّف",
    "الحالة","تاريخ التسليم"];
  if(RP.showSwaps) head=head.concat(["بدلاً من","سبب التبديل","تاريخ التبديل","محجوز"]);
  var rows=[head];
  projList().sort(sortProjects).forEach(function(p){
    if(RP.mgr!=="all"&&p.managerId!==RP.mgr) return;
    taskList(p).forEach(function(t){
      if(RP.who!=="all"&&t.assigneeId!==RP.who) return;
      if(!RP.showDone&&t.status==="منجز") return;
      var r=[personName(p.managerId),p.name,p.code||"",t.title||"",t.kind||"",
        personName(t.assigneeId),t.status||"لم يبدأ",p.dueDate||""];
      if(RP.showSwaps) r=r.concat(t.swap?[personName(t.swap.fromId),
        t.swap.reason+(t.swap.note?" — "+t.swap.note:""),t.swap.date||"",
        t.swap.reserved?"نعم":"لا"]:["","","",""]);
      rows.push(r);
    });
  });
  if(rows.length===1) return toast("لا توجد أعمال مطابقة للتصدير",true);
  xlsxBlob("الأعمال القائمة",rows).then(function(b){
    saveFile("الأعمال-القائمة-"+iso(today())+".xlsx",b,
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  });
}

  var stt=statusOf(p);

  var noteT=el("textarea",{id:"alNote",placeholder:"اكتب الملاحظة أو المطلوب من الموظف…"});
  noteT.value = preset || (stt.k==="late"
    ? "المشروع لم يُستكمل في الوقت المحدد. أفدني بوضع العمل الحالي وموعد الإنجاز."
    : stt.k==="today" ? "موعد تسليم المشروع اليوم. الرجاء رفع المخرجات النهائية."
    : stt.needReason ? "المشروع مسجّل كمتوقف بلا سبب. الرجاء استكمال سبب التوقف في البرنامج."
    : "");
  var box=el("div",{class:"msgbox"});
  var act=sel("alAct","تعديل",ACTIONS);
  var showTime=el("input",{id:"alTime",type:"checkbox"});
  function compose(){
    var L=[];

    L.push("");
    L.push("إجراء المعاملة من المهندس "+asg.name);

    L.push("اسم المشروع: "+p.name);

      L.push("تاريخ التسليم: "+fmtDate(p.dueDate)+" — "+dayName(p.dueDate));
      L.push("المدة: "+stt.label);
    }
    if(noteT.value.trim()){ L.push(""); L.push(noteT.value.trim()); }
    L.push("");
    L.push("وشكراً لكم — "+(mine?mine.name:""));
    return L.join("\n");
  }
  function refresh(){ box.textContent=compose(); }
  noteT.addEventListener("input",refresh);
  act.addEventListener("change",refresh);
  showTime.addEventListener("change",refresh);
  refresh();
  var phone=waPhone(asg.phone);

  openModal(modal("تنبيه "+asg.name,[
    el("div",{style:"display:flex;gap:10px;align-items:center"},[

      ]),

    ]),
    el("div",{class:"f-grid"},[
      el("div",{class:"field"},[el("label",{text:"الإجراء المراد تقديمه"}),act]),
      el("div",{class:"field"},[el("label",{text:"المدة الزمنية"}),
        el("label",{style:"display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;padding-top:6px"},

      target:"_blank",rel:"noopener",style:"text-decoration:none",text:"فتح واتساب",onclick:function(){
        var id=uid();
        put("notes",id,{projectId:p.id,text:noteT.value.trim()||stt.label,fromId:meId||"",toId:p.assigneeId,
          kind:"alert",createdAt:Date.now(),readAt:null});

    el("button",{class:"btn",text:"نسخ النص",onclick:function(e){

function applyFilters(list){
  var q=V.q.trim();
  return list.filter(function(p){
    var st=statusOf(p);
    if(V.filter!=="all" && st.k!==V.filter) return false;
    if(V.filter==="all" && !V.showDone && st.k==="done") return false;
    if(V.who!=="all" && p.assigneeId!==V.who) return false;
    if(V.mgr!=="all" && p.managerId!==V.mgr) return false;
    if(V.stage!=="all" && p.stage!==V.stage) return false;
    if(q){
      var hay=[p.name,p.code,p.client,p.type,personName(p.assigneeId)].join(" ");
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort(sortProjects);
}
/* الترتيب: المثبّت أولاً، ثم الأولوية (عاجلة ← عادية)، ثم حالة العمل، ثم أقرب تسليم */
function sortProjects(x,y){
  var ord={late:0,today:1,work:2,paused:3,done:4};
  var kx=statusOf(x).k, ky=statusOf(y).k;
  var dx=kx==="done"?1:0, dy=ky==="done"?1:0;
  if(dx!==dy) return dx-dy;
  var px=x.pinned?0:1, py=y.pinned?0:1;
  if(px!==py) return px-py;
  var qx=PRIO_RANK[x.priority]===undefined?2:PRIO_RANK[x.priority];
  var qy=PRIO_RANK[y.priority]===undefined?2:PRIO_RANK[y.priority];
  if(qx!==qy) return qx-qy;
  if(ord[kx]!==ord[ky]) return ord[kx]-ord[ky];
  return String(x.dueDate||"9999").localeCompare(String(y.dueDate||"9999"));
}

function TimelineView(){
  var rows=applyFilters(projList()).filter(function(p){return !!p.dueDate;});
  var wrap=el("div",{},[Toolbar()]);
  if(!rows.length){ wrap.appendChild(el("div",{class:"register"},[
    el("div",{class:"empty"},[el("h3",{text:"لا توجد مواعيد تسليم"}),
      el("p",{text:"أضف مشاريع بتواريخ تسليم لتظهر مرتّبة باليوم والتاريخ."})])])); return wrap; }
  var groups={},order=[];
  rows.forEach(function(p){ if(!groups[p.dueDate]){groups[p.dueDate]=[];order.push(p.dueDate);} groups[p.dueDate].push(p); });
  order.sort();
  var tISO=iso(today());
  order.forEach(function(k){
    var d=diffDays(k);
    var isToday=k===tISO;
    var tag = d<0 ? el("span",{class:"pill late tag",text:"متأخر "+Math.abs(d)+" يوم"})
      : isToday ? el("span",{class:"pill today tag",text:"اليوم"})
      : el("span",{class:"pill tag",text:"بعد "+d+" يوم"});
    var day=el("div",{class:"tl-day"+(isToday?" is-today":"")},[
      el("div",{class:"tl-hd"},[
        el("b",{text:DAYS[parseD(k).getDay()]}),
        el("span",{class:"dnum",text:fmtDate(k)}),
        tag
      ])
    ]);
    var items=el("div",{class:"tl-items"});
    groups[k].forEach(function(p){
      var st=statusOf(p);
      items.appendChild(el("div",{class:"tl-item"},[
        el("span",{class:"pill "+st.cls,text:p.stage}),
        el("span",{class:"p-name",text:p.name}),
        el("span",{class:"who"},[el("span",{class:"av",text:initials(personName(p.assigneeId))}),
          el("span",[el("b",{text:personName(p.assigneeId)})])]),
        el("button",{class:"btn ghost sm",text:"تفاصيل",onclick:function(){detail(p);}}),
        isBoss()?el("button",{class:"btn sm",text:"تنبيه",onclick:function(){alertForm(p);}}):null
      ]));
    });
    day.appendChild(items);
    wrap.appendChild(day);
  });
  return wrap;
}
