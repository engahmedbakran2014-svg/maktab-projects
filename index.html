/* ---------- الفترة: أسبوعية (الأحد–السبت) أو شهرية ---------- */
function pfRange(per,off){
  var t=today(), f, e;
  if(per==="week"){ f=new Date(t); f.setDate(t.getDate()-t.getDay()+7*off); e=new Date(f); e.setDate(f.getDate()+6); }
  else { f=new Date(t.getFullYear(),t.getMonth()+off,1); e=new Date(t.getFullYear(),t.getMonth()+off+1,0); }
  var end=new Date(e); end.setHours(23,59,59,999);
  var label=per==="week"
    ? ("أسبوع "+f.getDate()+" "+MONTHS[f.getMonth()]+" – "+e.getDate()+" "+MONTHS[e.getMonth()]+" "+e.getFullYear())
    : ("شهر "+MONTHS[f.getMonth()]+" "+f.getFullYear());
  return {per:per,off:off,from:f.getTime(),to:end.getTime(),fromIso:iso(f),toIso:iso(e),
    key:(per==="week"?"w":"m")+iso(f),label:label};
}
function pfEval(sid,R){
  var ev=((S.perf[sid]||{}).ev)||{};
  if(ev[R.key]) return {e:ev[R.key],own:true};
  var best=null;
  for(var k in ev){ var x=ev[k]; if(x&&x.to&&x.to<=R.toIso&&(!best||x.to>best.to||(x.to===best.to&&(x.at||0)>(best.at||0)))) best=x; }
  return {e:best,own:false};
}
function avgN(a){
  a=a.filter(function(v){ return v!==null&&v!==undefined&&v!==""&&!isNaN(v); }).map(Number);
  return a.length?Math.round(a.reduce(function(s,v){return s+v;},0)/a.length):null;
}
/* مؤشرات الموظف في الفترة */
function pfMetrics(sid,R){
  var items=wfItemsOf(sid);
  var doneIn=items.filter(function(x){ return x.done&&x.it.at&&x.it.at>=R.from&&x.it.at<=R.to; });
  var pend=items.filter(function(x){
    if(x.done||x.locked||wfPaused(x.p)||wsOf(x.p)==="مكتمل"||wsOf(x.p)==="ملغى"||!x.it.due) return false;
    var d=parseD(x.it.due); return !!d&&d.getTime()<=R.to; });
  var bDone=0,bOn=0,bPend=0,bList=[];
  for(var k in S.briefs){
    var b=S.briefs[k]; if(!b||b.assignedTo!==sid||!b.sentAt) continue;
    var due=b.ideaDue||addWorkDays(b.sentAt,Number(b.ideaDays)||DEF_IDEA_DAYS);
    if(b.ideaDoneAt){ var dd=parseD(b.ideaDoneAt); var t=dd?dd.getTime():0;
      if(t>=R.from&&t<=R.to){ bDone++; var ok=b.ideaDoneAt<=due; if(ok) bOn++; bList.push({b:b,due:due,ok:ok}); } }
    else { var du=parseD(due); if(du&&du.getTime()<=R.to) bPend++; }
  }
  var dn=doneIn.length+bDone, tot=dn+pend.length+bPend;
  var comp=tot?Math.round(100*dn/tot):null;
  var wd=doneIn.filter(function(x){ return !!x.it.due; });
  var onN=wd.filter(function(x){ return iso(new Date(x.it.at))<=x.it.due; }).length+bOn, onD=wd.length+bDone;
  var onAuto=onD?Math.round(100*onN/onD):null;
  var E=pfEval(sid,R), e=E.e||{};
  var time=avgN([onAuto,e.time]);
  var qual=avgN([e.qual,e.idea]);
  var req=(e.req===undefined||e.req===null||e.req==="")?null:Number(e.req);
  var log=((S.perf[sid]||{}).log)||[];
  var revLog=log.filter(function(l){ return l.type==="تعديل"&&l.date>=R.fromIso&&l.date<=R.toIso; }).length;
  var revs=(E.own&&e.revs!==undefined&&e.revs!==null&&e.revs!=="")?Number(e.revs):revLog;
  var act={}, sub={};
  allProjects().forEach(function(p){ if(p.assigneeId===sid&&wsOf(p)!=="مكتمل"&&wsOf(p)!=="ملغى") act[p.id]=1; });
  items.forEach(function(x){ if(!x.done&&wsOf(x.p)!=="مكتمل"&&wsOf(x.p)!=="ملغى") act[x.p.id]=1; });
  doneIn.forEach(function(x){ sub[x.p.id]=1; });
  bList.forEach(function(x){ if(x.b.projectId) sub[x.b.projectId]=1; });
  return {comp:comp,onAuto:onAuto,time:time,qual:qual,req:req,etime:e.time,outq:e.qual,idea:e.idea,
    revs:revs,revLog:revLog,ev:E,note:e.note||"",done:dn,tot:tot,pend:pend.length+bPend,
    late:items.filter(function(x){return x.late;}).length,projs:Object.keys(act).length,sub:Object.keys(sub).length,
    doneIn:doneIn,bList:bList,overall:avgN([comp,time,qual,req]),allDone:tot>0&&dn===tot};
}

/* ---------- الألوان من الأحمر إلى الأخضر ---------- */
function scCol(v){
  if(v===null||v===undefined||isNaN(v)) return "var(--pause)";
  /* منحنى يجعل النسب المنخفضة أقرب للأحمر والعالية للأخضر */

}
function scWord(v){

      '" stroke-dasharray="'+seg+' 360" transform="rotate('+rot+' '+c+' '+c+')"/>';
    if(L>0) h+='<circle class="pf-arc" cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" pathLength="360" style="stroke:'+scCol(v)+
      ';animation-delay:'+(i*140)+'ms" stroke-width="'+sw+'" stroke-dasharray="'+L.toFixed(1)+' 360" transform="rotate('+rot+' '+c+' '+c+')"/>';

function normDigits(s){
  return String(s==null?"":s).replace(/[٠-٩]/g,function(d){return String("٠١٢٣٤٥٦٧٨٩".indexOf(d));})
    .replace(/[۰-۹]/g,function(d){return String("۰۱۲۳۴۵۶۷۸۹".indexOf(d));});
}
function phoneKey(s){ var d=normDigits(s).replace(/\D/g,""); return d.length>=7?d.slice(-9):""; }
function nameKey(s){
  return String(s||"").replace(/^\s*(?:المهندسة|المهندس|مهندسة|مهندس|م|د|أ)\s*\.?\s+/,"")
    .replace(/[إأآا]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ً-ْـ]/g,"")
    .replace(/[.\-_،,]/g," ").replace(/\s+/g," ").trim().toLowerCase();

function findStaffMatch(row,exceptId){
  var pk=phoneKey(row.phone), nk=nameKey(row.name), byName=null;
  for(var k in S.staff){ if(k===exceptId) continue; var s=S.staff[k]; if(!s) continue;
    if(pk&&phoneKey(s.phone)===pk) return s;
    if(!byName&&nk&&nameKey(s.name)===nk) byName=s; }
  return byName;
}
/* استبدال المعرّفات القديمة بالجديدة داخل أي سجل (المسند إليه، المسؤول، الفريق، المهام…) */
function remapIds(o,map){
  if(typeof o==="string") return map.hasOwnProperty(o)?map[o]:o;
  if(Array.isArray(o)) return o.map(function(x){ return remapIds(x,map); });
  if(o&&typeof o==="object"){ var r={}; for(var k in o) r[k]=remapIds(o[k],map); return r; }
  return o;
}
function recTime(r){ return Number((r&&(r.updatedAt||r.createdAt))||0); }

/* ============ استعادة النسخة الاحتياطية بدون تكرار ============ */
function mergeBackup(data){
  var rep={added:0,updated:0,dup:0,staffNew:0,staffDup:0,projDup:0};
  var map={};
  /* الفريق: نفس المعرّف، أو نفس رقم الجوال، أو نفس الاسم = نفس الشخص */
  var src=data.staff||{};
  for(var k in src){
    var row=src[k]; if(!row||typeof row!=="object"||!row.name) continue;
    var cur=S.staff[k]||findStaffMatch(row);
    if(cur){
      if(cur.id!==k) map[k]=cur.id;
      var fill={}; ["phone","title","specialty"].forEach(function(f){ if(!cur[f]&&row[f]) fill[f]=row[f]; });
      if(Object.keys(fill).length){ patch("staff",cur.id,fill); rep.updated++; } else rep.staffDup++;
      continue;
    }
    var nr=JSON.parse(JSON.stringify(row)); delete nr.id;
    if(nr.pin){ for(var k2 in S.staff){ if(S.staff[k2]&&S.staff[k2].pin&&String(S.staff[k2].pin)===String(nr.pin)){ delete nr.pin; break; } } }
    if(MODE_FB&&nr.pin&&String(nr.pin).length<6) delete nr.pin;
    put("staff",k,nr); rep.staffNew++; rep.added++;
  }
  /* المشاريع: نفس المعرّف، أو نفس الرقم، أو نفس الاسم والمالك = نفس المشروع — يبقى الأحدث */
  var psrc=data.projects||{};
  for(var pk in psrc){
    var p=psrc[pk]; if(!p||typeof p!=="object"||!p.name) continue;
    var ex=S.projects[pk]||null;
    if(!ex){ for(var q in S.projects){ var o=S.projects[q];
      if((p.code&&o.code&&String(o.code).trim()===String(p.code).trim())||
         (nameKey(o.name)===nameKey(p.name)&&nameKey(o.client)===nameKey(p.client))){ ex=o; break; } } }
    if(ex&&ex.id!==pk) map[pk]=ex.id;
  }
  for(var pk2 in psrc){
    var p2=psrc[pk2]; if(!p2||typeof p2!=="object"||!p2.name) continue;
    var id=map[pk2]||pk2, ex2=S.projects[id];
    var np=remapIds(JSON.parse(JSON.stringify(p2)),map); delete np.id;
    if(ex2){ if(recTime(np)>recTime(ex2)){ put("projects",id,Object.assign({},ex2,np)); rep.updated++; } else { rep.dup++; rep.projDup++; } }
    else { put("projects",id,np); rep.added++; }
  }
  /* بقية السجلات: بالمعرّف، والملاحظات أيضاً بالنص والتاريخ */
  ["notes","reviews","logs","orders","briefs"].forEach(function(c){
    var s2=data[c]||{};
    for(var rk in s2){
      var r=s2[rk]; if(!r||typeof r!=="object") continue;
      var nr2=remapIds(JSON.parse(JSON.stringify(r)),map); delete nr2.id;
      var ex3=S[c][rk];
      if(!ex3&&c==="notes"){ for(var nk in S.notes){ var n=S.notes[nk];
        if(n&&n.text===nr2.text&&n.projectId===nr2.projectId&&Math.abs(recTime(n)-recTime(nr2))<60000){ ex3=n; break; } } }
      if(ex3){ if(recTime(nr2)>recTime(ex3)&&ex3.id===rk){ put(c,rk,Object.assign({},ex3,nr2)); rep.updated++; } else rep.dup++; }
      else { put(c,rk,nr2); rep.added++; }
    }
  });
  return rep;
}

function parseTeamText(txt){
  txt=String(txt||"").replace(/^﻿/,"").trim(); if(!txt) return [];
  if(/^[\[{]/.test(txt)){
    try{ var o=JSON.parse(txt), arr=[];
      if(Array.isArray(o)) arr=o;
      else if(o.staff) arr=Object.keys(o.staff).map(function(k){return o.staff[k];});
      else if(o.team) arr=o.team;
      return arr.filter(function(x){return x&&x.name;}).map(function(x){ return {name:String(x.name).trim(),phone:x.phone||"",title:x.title||"",specialty:x.specialty||"",kind:x.kind==="contact"?"contact":"staff"}; });
    }catch(e){}
  }
  var lines=txt.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  var delim=/\t/.test(lines[0])?"\t":/;/.test(lines[0])&&!/,/.test(lines[0])?";":",";
  function split(l){ var out=[],cur="",q=false; for(var i=0;i<l.length;i++){ var ch=l[i];
    if(ch==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(ch===delim&&!q){ out.push(cur); cur=""; } else cur+=ch; }
    out.push(cur); return out.map(function(x){return x.trim();}); }
  var head=split(lines[0]), idx={};
  head.forEach(function(h,i){ var x=h.toLowerCase();
    if(/اسم|name/.test(x)&&idx.name===undefined) idx.name=i;
    else if(/جوال|رقم|هاتف|phone|mobile|tel/.test(x)&&idx.phone===undefined) idx.phone=i;
    else if(/مسمى|title/.test(x)) idx.title=i;
    else if(/تخصص|special/.test(x)) idx.specialty=i;
    else if(/نوع|kind|type/.test(x)) idx.kind=i; });
  var hasHead=idx.name!==undefined||idx.phone!==undefined;
  var out=[];
  (hasHead?lines.slice(1):lines).forEach(function(l){
    var c=split(l), r;
    if(hasHead) r={name:c[idx.name]||"",phone:c[idx.phone]||"",title:c[idx.title]||"",specialty:c[idx.specialty]||"",kind:/مدير|contact/.test(c[idx.kind]||"")?"contact":"staff"};
    else if(c.length>1) r={name:c[0],phone:c[1],title:c[2]||"",specialty:"",kind:"staff"};
    else { var m=normDigits(l).match(/\+?\d[\d\s]{6,}\d/); r={name:(m?l.replace(m[0],""):l).replace(/[-–:|،,]+/g," ").trim(),phone:m?m[0].replace(/\s/g,""):"",title:"",specialty:"",kind:"staff"}; }
    if(r.name) out.push(r);
  });
  return out;
}

/* المدة المحددة لتقديم الفكرة المبدئية والتعديل */
function briefClock(b){
  if(!b||!b.showTerms) return null;
  var days=Number(b.ideaDays)||DEF_IDEA_DAYS;
  if(!b.sentAt) return {state:"wait",cls:"pause",label:"لم تُرسل للمهندس بعد",days:days};
  var due=b.ideaDue||addWorkDays(b.sentAt,days);
  if(b.ideaDoneAt){
    var lateDone=parseD(b.ideaDoneAt)>parseD(due);
    return {state:"done",cls:lateDone?"work":"done",due:due,days:days,
      label:"قُدّمت الفكرة "+fmtDate(b.ideaDoneAt)+(lateDone?" — بعد الموعد":" — في وقتها")};
  }
  var left=workDaysLeft(due);
  var cls = left<0?"late":(left<=1?"work":"done");
  var label = left<0 ? "تأخر التقديم "+Math.abs(left)+" يوم عمل"
    : left===0 ? "اليوم آخر موعد لتقديم الفكرة"
    : "متبقٍ "+left+" يوم عمل من "+days;
  return {state:left<0?"late":"open",cls:cls,due:due,left:left,days:days,label:label};
}
function briefsLate(){
  return briefList().filter(function(b){
    var c=briefClock(b); return c&&c.state==="late"; });
}

var WL={who:"all",work:true,late:true,paused:true,done:false,tasks:true};
function wlMatch(p,who){
  if(who==="all") return true;
  if(p.assigneeId===who||p.managerId===who) return true;
  if((p.team||[]).some(function(t){return t.staffId===who;})) return true;
  if((p.tasks||[]).some(function(t){return t.assigneeId===who;})) return true;
  return false;
}
function wlRows(){
  return projList().filter(function(p){
    if(!wlMatch(p,WL.who)) return false;
    var k=statusOf(p).k;
    if(k==="paused") return WL.paused;
    if(k==="done") return WL.done;
    if(k==="late"||k==="today") return WL.late;
    return WL.work;
  }).sort(sortProjects);
}
function wlProjectRow(p){
  var st=statusOf(p), a=S.staff[p.assigneeId], tk=taskList(p);
  var d=diffDays(p.dueDate);
  return {
    code:p.code||"", name:p.name||"", client:p.client||"", type:p.type||"",
    stage:p.stage||"", ws:wsOf(p),
    reason: wsOf(p)==="متوقف" ? ((p.pauseReason||"").trim()||"لم يُذكر السبب") : "—",
    status:st.label,
    lateDays:(st.k==="late"&&d!==null)?Math.abs(d):"",
    start:p.startDate||"", due:p.dueDate||"", day:p.dueDate?dayName(p.dueDate):"",
    prio:p.priority||"عادية", who:personName(p.assigneeId), phone:a?a.phone:"",
    mgr:personName(p.managerId),
    tTotal:tk.length,
    tDone:tk.filter(function(t){return t.status==="منجز";}).length,
    tWork:tk.filter(function(t){return t.status==="قيد التنفيذ";}).length,
    tNone:tk.filter(function(t){return t.status==="لم يبدأ";}).length,
    last:(projLogs(p.id)[0]||{}).date||""
  };
}

/* ============ alert / reminder ============ */
function alertForm(p,preset){
  var asg=S.staff[p.assigneeId];
  if(!asg) { toast("لم يُحدَّد موظف لهذا المشروع",true); return; }
  if(!canMessage(p.assigneeId)){
    toast("لا تملك صلاحية إرسال تنبيه لـ"+asg.name+" — صلاحيتك محصورة بـ"+
      (msgScope()==="draftsmen"?"الرسامين":"لا أحد"),true);
    return;
  }
  var stt=statusOf(p);
  var mine=me();
  var noteT=el("textarea",{id:"alNote",placeholder:"اكتب الملاحظة أو المطلوب من الموظف…"});
  noteT.value = preset || (stt.k==="late"
    ? "المشروع لم يُستكمل في الوقت المحدد. أفدني بوضع العمل الحالي وموعد الإنجاز."
    : stt.k==="today" ? "موعد تسليم المشروع اليوم. الرجاء رفع المخرجات النهائية."
    : stt.needReason ? "المشروع مسجّل كمتوقف بلا سبب. الرجاء استكمال سبب التوقف في البرنامج."
    : "");
  var box=el("div",{class:"msgbox"});
  var act=sel("alAct","تعديل",ACTIONS);
  var showTime=el("input",{id:"alTime",type:"checkbox"});
  function compose(){
    var L=[];
    L.push("السلام عليكم ورحمة الله");
    L.push("");
    L.push("إجراء المعاملة من المهندس "+asg.name);
    L.push("رقم المشروع: "+(p.code||"—"));
    L.push("اسم المشروع: "+p.name);
    L.push("الإجراء المطلوب: "+act.value);
    if(showTime.checked){
      L.push("تاريخ التسليم: "+fmtDate(p.dueDate)+" — "+dayName(p.dueDate));
      L.push("المدة: "+stt.label);
    }
    if(noteT.value.trim()){ L.push(""); L.push(noteT.value.trim()); }
    L.push("");
    L.push("وشكراً لكم — "+(mine?mine.name:""));
    return L.join("\n");
  }
  function refresh(){ box.textContent=compose(); }
  noteT.addEventListener("input",refresh);
  act.addEventListener("change",refresh);
  showTime.addEventListener("change",refresh);
  refresh();
  var phone=waPhone(asg.phone);

  openModal(modal("تنبيه "+asg.name,[
    el("div",{style:"display:flex;gap:10px;align-items:center"},[
      el("span",{class:"av",text:initials(asg.name)}),
      el("span",{style:"flex:1"},[
        el("b",{style:"display:block;font-size:14px",text:asg.name}),
        el("small",{class:"num",style:"color:var(--ink-3);font-size:12px",text:asg.phone||"لا يوجد رقم"})
      ]),
      el("span",{class:"pill "+stt.cls,text:stt.label})
    ]),
    el("div",{class:"f-grid"},[
      el("div",{class:"field"},[el("label",{text:"الإجراء المراد تقديمه"}),act]),
      el("div",{class:"field"},[el("label",{text:"المدة الزمنية"}),
        el("label",{style:"display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;padding-top:6px"},
          [showTime,el("span",{text:"ذكر المدة وتاريخ التسليم في الرسالة"})])])
    ]),
    field("الملاحظة",noteT,null,true),
    el("div",{class:"field full"},[ el("label",{text:"نص الرسالة"}), box ])
  ],[
    el("button",{class:"btn primary",text:"تسجيل التنبيه في البرنامج",onclick:function(){
      var id=uid();
      put("notes",id,{projectId:p.id,text:noteT.value.trim()||stt.label,fromId:meId||"",toId:p.assigneeId,
        kind:"alert",createdAt:Date.now(),readAt:null});
      closeModal(); toast("تم تسجيل التنبيه — سيظهر لـ"+asg.name+" عند فتح البرنامج");
    }}),
    phone?el("a",{class:"btn",href:"https://wa.me/"+phone+"?text="+encodeURIComponent(compose()),
      target:"_blank",rel:"noopener",style:"text-decoration:none",text:"فتح واتساب",onclick:function(){
        var id=uid();
        put("notes",id,{projectId:p.id,text:noteT.value.trim()||stt.label,fromId:meId||"",toId:p.assigneeId,
          kind:"alert",createdAt:Date.now(),readAt:null});
        setTimeout(closeModal,150);
      }}):el("span",{class:"pill",text:"أضف رقم جوال للموظف لتفعيل واتساب"}),
    el("button",{class:"btn",text:"نسخ النص",onclick:function(e){
      var t=compose();
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){toast("تم نسخ نص الرسالة");},
          function(){ toast("انسخ النص يدوياً من المربع أعلاه",true); });
      } else toast("انسخ النص يدوياً من المربع أعلاه",true);
    }})
  ]));
}

/* ============ rendering ============ */
var _rendering=false,_dirty=false;
function render(){
  if(_rendering){ _dirty=true; return; }      /* يمنع تكرار القوائم عند تداخل التحديثات */
  _rendering=true;
  try{ doRender(); } finally { _rendering=false; }
  if(_dirty){ _dirty=false; render(); }
}
function doRender(){
  var root=$("#root"); if(!root) return;
  var anyStaff=Object.keys(S.staff).length>0;
  if(UNLOCKED && MODE!=="loading" && anyStaff && !me()) UNLOCKED=false;
  if(needsLink()){ root.innerHTML=""; UNLOCKED=false; showLock(); return; }
  if(MODE==="auth"){ root.innerHTML=""; UNLOCKED=false; showLock(); return; }
  var fresh = MODE!=="loading" && MODE!=="revoked" && !anyStaff;
  if(!UNLOCKED && !fresh){ root.innerHTML=""; showLock(); return; }
  hideLock();
  var scrollY=window.scrollY;
  root.innerHTML="";
  root.appendChild(Header());
  if(MODE==="loading"){ root.appendChild(el("div",{class:"empty",text:"جارٍ فتح قاعدة البيانات…"})); return; }
  if(MODE==="revoked"){ root.appendChild(el("div",{class:"empty"},[
    el("h3",{text:"انتهت صلاحية الوصول"}),
    el("p",{text:"أعد تحميل الصفحة للاتصال بقاعدة البيانات من جديد."})]));
    return; }
  if(MODE==="local") root.appendChild(el("div",{class:"banner local"},[
    el("b",{text:"وضع محلي."}),
    el("span",{text:MODE_ERR
      ? ("تعذّر الاتصال بقاعدة البيانات المشتركة ("+MODE_ERR+") — البيانات محفوظة على هذا المتصفح فقط.")
      : "البيانات محفوظة على هذا المتصفح فقط ولا تصل للموظفين."}),
    el("span",{class:"spacer"}),

function applyFilters(list){
  var q=V.q.trim();
  return list.filter(function(p){
    var st=statusOf(p);
    if(V.filter!=="all" && st.k!==V.filter) return false;
    if(V.filter==="all" && !V.showDone && (st.k==="done"||st.k==="cancel")) return false;
    if(V.who!=="all" && p.assigneeId!==V.who) return false;
    if(V.mgr!=="all" && p.managerId!==V.mgr) return false;
    if(V.stage!=="all" && p.stage!==V.stage) return false;
    if(q){
      var hay=[p.name,p.code,p.client,p.type,personName(p.assigneeId)].join(" ");
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort(sortProjects);
}
/* الترتيب: المثبّت أولاً، ثم الأولوية (عاجلة ← عادية)، ثم حالة العمل، ثم أقرب تسليم */
function sortProjects(x,y){
  var ord={late:0,today:1,work:2,idea:3,paused:4,done:5,cancel:6};
  var kx=statusOf(x).k, ky=statusOf(y).k;
  var dx=(kx==="done"||kx==="cancel")?1:0, dy=(ky==="done"||ky==="cancel")?1:0;
  if(dx!==dy) return dx-dy;
  var px=x.pinned?0:1, py=y.pinned?0:1;
  if(px!==py) return px-py;
  var qx=PRIO_RANK[x.priority]===undefined?2:PRIO_RANK[x.priority];
  var qy=PRIO_RANK[y.priority]===undefined?2:PRIO_RANK[y.priority];
  if(qx!==qy) return qx-qy;
  if(ord[kx]!==ord[ky]) return ord[kx]-ord[ky];
  return String(x.dueDate||"9999").localeCompare(String(y.dueDate||"9999"));
}

function TimelineView(){
  var rows=applyFilters(projList()).filter(function(p){return !!p.dueDate;});
  var wrap=el("div",{},[Toolbar()]);
  if(!rows.length){ wrap.appendChild(el("div",{class:"register"},[
    el("div",{class:"empty"},[el("h3",{text:"لا توجد مواعيد تسليم"}),
      el("p",{text:"أضف مشاريع بتواريخ تسليم لتظهر مرتّبة باليوم والتاريخ."})])])); return wrap; }
  var groups={},order=[];
  rows.forEach(function(p){ if(!groups[p.dueDate]){groups[p.dueDate]=[];order.push(p.dueDate);} groups[p.dueDate].push(p); });
  order.sort();
  var tISO=iso(today());
  order.forEach(function(k){
    var d=diffDays(k);
    var isToday=k===tISO;
    var tag = d<0 ? el("span",{class:"pill late tag",text:"متأخر "+Math.abs(d)+" يوم"})
      : isToday ? el("span",{class:"pill today tag",text:"اليوم"})
      : el("span",{class:"pill tag",text:"بعد "+d+" يوم"});
    var day=el("div",{class:"tl-day"+(isToday?" is-today":"")},[
      el("div",{class:"tl-hd"},[
        el("b",{text:DAYS[parseD(k).getDay()]}),
        el("span",{class:"dnum",text:fmtDate(k)}),
        tag
      ])
    ]);
    var items=el("div",{class:"tl-items"});
    groups[k].forEach(function(p){
      var st=statusOf(p);
      items.appendChild(el("div",{class:"tl-item"},[
        el("span",{class:"pill "+st.cls,text:p.stage}),
        el("span",{class:"p-name",text:p.name}),
        el("span",{class:"who"},[el("span",{class:"av",text:initials(personName(p.assigneeId))}),
          el("span",[el("b",{text:personName(p.assigneeId)})])]),
        el("button",{class:"btn ghost sm",text:"تفاصيل",onclick:function(){detail(p);}}),
        canEdit(p)?el("button",{class:"btn sm",text:"تنبيه",onclick:function(){alertForm(p);}}):null
      ]));
    });
    day.appendChild(items);
    wrap.appendChild(day);
  });
  return wrap;
}
