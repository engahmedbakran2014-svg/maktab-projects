<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="برنامج إدارة مشاريع المكتب الهندسي — ترتيب المشاريع والمهام والموافقات المبدئية">
<meta name="theme-color" content="#0F6E64">
<style>
  html,body{margin:0;padding:0}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#EDF0F2;color:#16232E}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<title>إدارة مشاريع المكتب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F8F9; --surface-3:#EAEFF1;
  --line:#D4DCE0; --line-soft:#E4EAEC;
  --ink:#16232E; --ink-2:#485B66; --ink-3:#7A8C96;
  --accent:#0F6E64; --accent-2:#0B534B; --accent-soft:#DBEAE7;
  --crit:#B0352A; --crit-soft:#F7DFDB;
  --work:#B25E0C; --work-soft:#FAE8D3;
  --warn:#8E6110; --warn-soft:#F5E9D2;
  --good:#25714A; --good-soft:#D9EEE2;
  --pause:#6C7B84; --pause-soft:#E6EAEC;
  --info:#2A5A83; --info-soft:#DDE8F1;
  --shadow:0 1px 2px rgba(22,35,46,.05), 0 10px 26px -16px rgba(22,35,46,.30);
  --r:10px;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-disp:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1417; --surface:#171F24; --surface-2:#1D262C; --surface-3:#232E35;
    --line:#2B373E; --line-soft:#222C32;
    --ink:#E2E9EC; --ink-2:#A0B0B8; --ink-3:#72848D;
    --accent:#4FAE9F; --accent-2:#6BC4B5; --accent-soft:#123430;
    --crit:#EA8474; --crit-soft:#3A201B;
    --work:#E39A4E; --work-soft:#38260F;
    --warn:#D9A94F; --warn-soft:#302512;
    --good:#6DC292; --good-soft:#143020;
    --pause:#93A4AD; --pause-soft:#242E34;
    --info:#7EB1DB; --info-soft:#122534;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1417; --surface:#171F24; --surface-2:#1D262C; --surface-3:#232E35;
  --line:#2B373E; --line-soft:#222C32;
  --ink:#E2E9EC; --ink-2:#A0B0B8; --ink-3:#72848D;
  --accent:#4FAE9F; --accent-2:#6BC4B5; --accent-soft:#123430;
  --crit:#EA8474; --crit-soft:#3A201B;
  --work:#E39A4E; --work-soft:#38260F;
  --warn:#D9A94F; --warn-soft:#302512;
  --good:#6DC292; --good-soft:#143020;
  --pause:#93A4AD; --pause-soft:#242E34;
  --info:#7EB1DB; --info-soft:#122534;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);margin:0;
  -webkit-font-smoothing:antialiased}
#app{direction:rtl;text-align:right;max-width:1180px;margin:0 auto;padding-inline:18px;padding-block:0 56px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;unicode-bidi:plaintext;display:inline-block}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--ground);
  border-bottom:1px solid var(--line);margin-inline:-18px;padding:14px 18px 12px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center;min-width:0}
.mark{width:38px;height:38px;flex:none;border-radius:9px;background:var(--accent);position:relative;overflow:hidden}
.mark::before,.mark::after{content:"";position:absolute;background:rgba(255,255,255,.5)}
.mark::before{inset:9px auto 9px 9px;width:1px;right:13px}
.mark::after{inset:auto 9px 13px 9px;height:1px}
.mark span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:600 13px/1 var(--f-num)}
.brand h1{font-size:17px;line-height:1.3}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.today{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  border-inline-start:2px solid var(--accent);padding-inline-start:11px}
.today b{font-size:13.5px;font-weight:600}
.today small{font-size:11.5px;color:var(--ink-3)}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:8px 13px;font-size:13px;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:6px 9px}
.btn.ghost:hover{background:var(--surface-3);border-color:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger:hover{background:var(--crit-soft);border-color:var(--crit)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- banners ---------- */
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:var(--r);
  padding:11px 14px;font-size:13px;margin-top:14px;border:1px solid}
.banner.alert{background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 35%,transparent);color:var(--warn)}
.banner.local{background:var(--info-soft);border-color:color-mix(in oklab,var(--info) 30%,transparent);color:var(--info)}
.banner b{font-weight:600}
.banner .spacer{flex:1}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:12px 13px 11px;text-align:right;position:relative;transition:.15s;min-width:0}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile .k{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-weight:500}
.tile .dot{width:7px;height:7px;border-radius:50%;flex:none}
.tile .v{font:600 25px/1.1 var(--f-num);margin-top:7px;letter-spacing:-.02em}
.tile .sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.t-late .dot{background:var(--crit)} .t-late .v{color:var(--crit)}
.t-today .dot{background:var(--crit)} .t-today .v{color:var(--crit)}
.t-work .dot{background:var(--work)} .t-work .v{color:var(--work)}
.t-pause .dot{background:var(--pause)} .t-pause .v{color:var(--pause)}
.t-done .dot{background:var(--good)} .t-done .v{color:var(--good)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pipnum{background:var(--crit);color:#fff;border-radius:20px;font:600 10.5px/1 var(--f-num);padding:3px 6px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px}
.toolbar input,.toolbar select{width:auto;min-width:150px;flex:0 1 auto;font-size:13px;padding:7px 10px}
.toolbar .grow{flex:1 1 190px;min-width:150px}
.toolbar .spacer{flex:1}

/* ---------- register (project list) ---------- */
.register{margin-top:14px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.reg-head{display:grid;grid-template-columns:4px 2.3fr 1fr 1.15fr 1.25fr auto;gap:14px;align-items:center;
  padding:9px 14px 9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.row{display:grid;grid-template-columns:4px 2.3fr 1fr 1.15fr 1.25fr auto;gap:14px;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--line-soft);position:relative}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.stripe{align-self:stretch;border-radius:3px;background:var(--ink-3);min-height:38px}
.row.s-late .stripe{background:var(--crit)}
.row.s-today .stripe{background:var(--crit);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 7px)}
.row.s-work .stripe{background:var(--work)}
.row.s-pause .stripe{background:var(--pause)}
.row.s-done .stripe{background:var(--good)}
.row.needs-reason{background:var(--pause-soft)}
.p-name{font-weight:600;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.p-meta{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code{font-family:var(--f-num);font-size:11px;color:var(--ink-2);background:var(--surface-3);
  border-radius:4px;padding:1px 5px;direction:ltr;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  border-radius:20px;padding:3px 9px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.late{background:var(--crit-soft);color:var(--crit)}
.pill.today{background:var(--crit-soft);color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit)}
.pill.work{background:var(--work-soft);color:var(--work)}
.pill.pause{background:var(--pause-soft);color:var(--pause);box-shadow:inset 0 0 0 1px var(--pause)}
.pill.soon{background:var(--info-soft);color:var(--info)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
button.pill{border:0;transition:.15s}
button.pill:hover{filter:brightness(.96);box-shadow:inset 0 0 0 1px currentColor}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.av{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;
  font:600 11px/1 var(--f-body);background:var(--accent-soft);color:var(--accent)}
.av.mgr{background:var(--info-soft);color:var(--info)}
.who b{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:11px;color:var(--ink-3);font-family:var(--f-num);unicode-bidi:plaintext;display:block}
.due b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;display:block}
.due small{font-size:11.5px;color:var(--ink-3);display:block;margin-top:2px}
.due .pill{max-width:100%;flex-wrap:nowrap}
.prog{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:7px;max-width:150px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.acts{display:flex;gap:4px;align-items:center}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:8px}
.empty .btn{margin-top:14px}

/* ---------- timeline ---------- */
.tl-day{margin-top:20px}
.tl-hd{display:flex;gap:10px;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tl-hd b{font-family:var(--f-disp);font-size:14px}
.tl-hd .dnum{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl-hd .tag{margin-inline-start:auto;font-size:11px}
.tl-day.is-today .tl-hd{border-bottom-color:var(--accent)}
.tl-day.is-today .tl-hd b{color:var(--accent)}
.tl-items{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border-radius:var(--r);
  overflow:hidden;margin-top:10px;border:1px solid var(--line-soft)}
.tl-item{background:var(--surface);padding:11px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tl-item .p-name{flex:1 1 220px;min-width:0}

/* ---------- notes ---------- */
.note{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.note.unread{border-color:color-mix(in oklab,var(--crit) 45%,transparent);background:var(--crit-soft)}
.note-hd{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.note-hd b{color:var(--ink);font-size:13px}
.note-body{font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.note-ft{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:14px}

/* ---------- الموافقات المبدئية ---------- */
.rev{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow)}
.rev-top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:14px 15px 12px}
.rev-top .ttl{flex:1 1 260px;min-width:0}
.rev-top .ttl b{font-size:15px;font-weight:600;display:block;line-height:1.35}
.rev-top .ttl .sub{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clock{padding:0 15px 13px}
.clock-hd{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.clock-hd b{font-size:13px;font-weight:600}
.clock-hd .spacer{flex:1}
.bar{height:9px;border-radius:6px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.bar.c-done i{background:var(--good)}
.bar.c-work i{background:var(--work)}
.bar.c-late i{background:var(--crit);width:100%!important}
.bar.c-pause i{background:var(--pause)}
.bar .ticks{position:absolute;inset:0;display:flex;pointer-events:none}
.bar .ticks span{flex:1;border-inline-start:1px solid var(--surface);opacity:.55}
.bar .ticks span:first-child{border:0}
.rev-body{padding:0 15px 13px;display:flex;flex-direction:column;gap:11px}
.rmk{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:11px 13px;
  font-size:13.5px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.rmk .lbl{font-size:11px;font-weight:600;color:var(--ink-3);display:block;margin-bottom:5px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:78px;height:78px;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2);display:block;position:relative;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;inset-inline-end:2px;background:var(--crit);color:#fff;border:0;
  border-radius:5px;width:19px;height:19px;font-size:12px;line-height:1;display:grid;place-items:center}
.rev-ft{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:11px 15px;
  background:var(--surface-2);border-top:1px solid var(--line-soft)}
.rev-ft .spacer{flex:1}
.track{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.7;
  background:var(--info-soft);border-color:color-mix(in oklab,var(--info) 28%,transparent);color:var(--ink-2)}
.track b{color:var(--info)}
.grp-hd{display:flex;gap:10px;align-items:center;margin-top:20px;padding-bottom:8px;
  border-bottom:2px solid var(--accent)}
.grp-hd .av{width:26px;height:26px;font-size:10.5px;border-radius:7px}
.grp-hd b{font-family:var(--f-disp);font-size:14px}
.grp-hd .spacer{flex:1}
.star{border:0;background:none;padding:0 2px;font-size:14px;line-height:1;color:var(--ink-3);cursor:pointer}
.star.on{color:var(--work)}
.upload-lbl{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);
  border-radius:8px;padding:9px 13px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.upload-lbl:hover{border-color:var(--accent);color:var(--accent)}
.upload-lbl input{display:none}

/* ---------- جدول الأعمال ---------- */
.tasktable{border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.tt-row{display:grid;grid-template-columns:1.7fr 1.05fr 1.1fr .95fr;gap:12px;align-items:center;
  padding:10px 13px;border-bottom:1px solid var(--line-soft);border-inline-start:4px solid transparent}
.tt-row.tt-5{grid-template-columns:1.3fr 1.5fr 1fr 1fr .9fr}
.tt-row:last-child{border-bottom:0}
.tt-head{background:var(--surface-2);font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.tt-row.st-done{border-inline-start-color:var(--good);background:color-mix(in oklab,var(--good-soft) 55%,transparent)}
.tt-row.st-work{border-inline-start-color:var(--work)}
.tt-row.st-soon{border-inline-start-color:var(--info);background:color-mix(in oklab,var(--info-soft) 55%,transparent)}
.tt-row.st-pause{border-inline-start-color:var(--pause)}
.tt-name{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.tt-row .pill{justify-self:start}
.tt-row select{max-width:150px}

/* ---------- متطلبات بلدي ---------- */
.reqwrap{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:var(--surface-2)}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:4px}
.req{display:flex;align-items:center;gap:9px;text-align:right;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;transition:.15s}
.req:hover:not(:disabled){border-color:var(--accent)}
.req .box{width:19px;height:19px;flex:none;border-radius:5px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.req.on{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.req.on .box{background:var(--good);border-color:var(--good)}
.req:disabled{opacity:.75;cursor:default}

/* ---------- صفحة المسؤول ---------- */
.desk-hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px 15px;box-shadow:var(--shadow)}
.folderbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px;
  border:1px dashed var(--line);border-radius:var(--r);padding:13px 15px;background:var(--surface-2)}
.folderbar b{font-size:13.5px;flex:0 0 auto}
.folderbar .spacer{flex:1}
/* ---------- متطلبات العميل ---------- */
.filechip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;max-width:100%}
.filechip a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip a:hover{text-decoration:underline}
.sketchbox{display:flex;gap:10px;flex-wrap:wrap}
.sketchimg{max-width:100%;width:520px;border:1px solid var(--line);border-radius:9px;display:block}
ul.plist{margin:6px 0;padding-inline-start:20px;font-size:13px;line-height:1.9}
.ptext{font-size:13px;line-height:1.8;white-space:pre-wrap;margin:4px 0}
.blanktall{height:56px}
.gatebox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;background:var(--surface-2)}
.gatebox b{font-size:13.5px}
.whochip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;
  color:var(--ink-2);padding:6px 9px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--line-soft)}

/* ---------- تبديل المكلّف ---------- */
.swapline{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:5px;
  font-size:11.5px;color:var(--ink-3)}
.swapbtns{display:flex;gap:3px;margin-top:3px}
.swapnote{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.5}

/* ---------- شاشة الحفظ ---------- */
.savelog{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:11px 13px}
.sl{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.6;color:var(--ink-2)}
.sl .ic{width:17px;height:17px;flex:none;border-radius:5px;display:grid;place-items:center;
  font-size:11px;background:var(--surface-3);color:var(--ink-3);margin-top:2px}
.sl.ok .ic{background:var(--good-soft);color:var(--good)}
.sl.bad{color:var(--crit)} .sl.bad .ic{background:var(--crit-soft);color:var(--crit)}

/* ---------- أوراق الطباعة ---------- */
.rpopts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:11px 13px;
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;font-size:13px}
.rpopts label{display:flex;gap:7px;align-items:center;cursor:pointer;font-weight:500}
.rpopts select{width:auto;min-width:150px;font-size:12.5px;padding:6px 9px}
.modal:has(.printsheet){max-width:940px}
.printsheet{display:flex;flex-direction:column;gap:10px}
.printsheet table.psheet{table-layout:auto}
.psheet-hd{display:flex;flex-direction:column;gap:4px;border-bottom:2px solid var(--accent);padding-bottom:9px}
.psheet-hd b{font-family:var(--f-disp);font-size:16px}
.psheet-hd span{font-size:11.5px;color:var(--ink-3)}
.psub{font-size:13.5px;margin-top:8px;color:var(--accent)}
table.psheet{width:100%;border-collapse:collapse;font-size:12.5px}
table.psheet th,table.psheet td{border:1px solid var(--line);padding:7px 9px;text-align:right;
  vertical-align:top;line-height:1.6}
table.psheet thead th{background:var(--surface-3);font-weight:600;font-size:11.5px;color:var(--ink-2)}
table.psheet tbody th{background:var(--surface-2);font-weight:600;width:34%;color:var(--ink-2)}
table.psheet tr.st-done td{background:var(--good-soft)}
table.psheet tr.st-work td:last-child,table.psheet tr.st-work td:nth-last-child(3){color:var(--work);font-weight:600}
table.psheet .blankcell{min-width:120px}
table.psheet td.warncell{color:var(--crit);font-weight:600}
table.psheet tr.st-pause td{background:var(--pause-soft)}
table.psheet tr.st-late td:last-child,table.psheet tr.st-late td:nth-child(7){color:var(--crit);font-weight:600}
.plog{border-inline-start:3px solid var(--accent);padding:2px 11px;font-size:12.5px;line-height:1.75}
.plog b{display:block;font-size:12px;color:var(--accent);margin-bottom:3px}
.signrow{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px;padding-top:12px;
  border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}

/* ---------- staff ---------- */
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px;margin-top:14px}
.scard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;
  display:flex;flex-direction:column;gap:10px}
.scard .top{display:flex;gap:10px;align-items:center}
.scard .av{width:38px;height:38px;font-size:14px;border-radius:9px}
.scard .nm{font-weight:600;font-size:14.5px}
.scard .ttl{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.scard .stats{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);
  border-top:1px solid var(--line-soft);padding-top:9px}
.scard .stats b{font-family:var(--f-num);font-size:14px;display:block;color:var(--ink);font-weight:600}
.scard .stats .bad b{color:var(--crit)}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(10,18,23,.55);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{direction:rtl;text-align:right;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;width:100%;max-width:600px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
  margin:auto;display:flex;flex-direction:column}
.m-hd{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.m-hd h2{font-size:16px;flex:1}
.m-bd{padding:16px 18px;display:flex;flex-direction:column;gap:13px}
.m-ft{padding:13px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-start;
  flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 14px 14px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11px;color:var(--ink-3)}
textarea{resize:vertical;min-height:80px;line-height:1.6}
.msgbox{background:var(--surface-2);border:1px dashed var(--line);border-radius:9px;padding:11px 13px;
  font-size:13px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;max-height:230px;overflow:auto}
.picklist{display:flex;flex-direction:column;gap:7px;max-height:340px;overflow:auto}
.pick{display:flex;gap:10px;align-items:center;text-align:right;width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;transition:.15s}
.pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick .nm{font-weight:600;font-size:14px}
.pick .ttl{font-size:11.5px;color:var(--ink-3)}

.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.foot .spacer{flex:1}

@media (max-width:900px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .reg-head{display:none}
  .row{grid-template-columns:4px 1fr;gap:10px 12px;align-items:start}
  .row>.stripe{grid-row:1/span 4}
  .row .who,.row .due,.row .stagecell,.row .acts{grid-column:2}
  .acts{justify-content:flex-start}
}
@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .f-grid{grid-template-columns:1fr}
  .topbar{padding-block:11px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .topbar,.tabs,.toolbar,.acts,.btn,.banner,.noprint,.rpopts{display:none!important}
  body{background:#fff;color:#000}
  .register,.note,.scard,.rev{box-shadow:none;border-color:#bbb}
  .mask{position:static;background:none;backdrop-filter:none;padding:0;display:block;overflow:visible}
  .modal{max-width:none;border:0;box-shadow:none;border-radius:0;background:#fff}
  .m-hd,.m-ft{display:none!important}
  .m-bd{padding:0;gap:8px}
  body:has(.mask) #app{display:none}
  table.psheet{page-break-inside:auto}
  table.psheet tr{page-break-inside:avoid}
  .psub{page-break-after:avoid}
}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hk-color:#72C27C}}

#app{position:relative;z-index:1}
body.wm::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:var(--hk-color);
  -webkit-mask:var(--hk-mask) center 58%/min(74vw,760px) auto no-repeat;
  mask:var(--hk-mask) center 58%/min(74vw,760px) auto no-repeat;
  opacity:.2;animation:wmIn 1.1s ease both}
@keyframes wmIn{from{opacity:0;transform:scale(1.06)}to{opacity:.2;transform:none}}

.lock{position:fixed;inset:0;z-index:80;direction:rtl;text-align:center;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:var(--ground);
  transition:opacity .7s ease,visibility .7s}
.lock.gone{opacity:0;visibility:hidden;pointer-events:none}
.lock-bg{position:absolute;inset:-15%;filter:blur(70px) saturate(1.05);
  background:
    radial-gradient(38% 42% at 20% 26%,color-mix(in oklab,var(--accent) 60%,transparent),transparent 72%),
    radial-gradient(36% 40% at 80% 74%,color-mix(in oklab,var(--accent-2) 50%,transparent),transparent 72%),
    radial-gradient(28% 32% at 76% 18%,color-mix(in oklab,var(--good) 34%,transparent),transparent 72%),
    radial-gradient(32% 34% at 24% 82%,color-mix(in oklab,var(--info) 28%,transparent),transparent 72%),
    var(--ground);
  animation:lockDrift 26s ease-in-out infinite alternate}
@keyframes lockDrift{to{transform:translate3d(2.5%,-2%,0) scale(1.07)}}
.lock-veil{position:absolute;inset:0;background:color-mix(in oklab,var(--surface) 30%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lock-stage{position:relative;width:100%;max-width:620px;padding:24px 16px;
  display:flex;flex-direction:column;align-items:center;gap:18px}
.lock-halo{position:relative;display:grid;place-items:center;width:min(84vw,500px);aspect-ratio:900/522}
.lock-halo::before{content:"";position:absolute;inset:-18% -12%;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in oklab,var(--surface) 70%,transparent),transparent);
  transition:opacity .6s}
.lock-logo{position:relative;width:100%;height:100%;background:var(--hk-color);
  -webkit-mask:var(--hk-mask) center/contain no-repeat;mask:var(--hk-mask) center/contain no-repeat;
  opacity:.92;
  transition:opacity .6s ease,filter .6s ease,transform .6s ease}
.lock-intro{display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .4s,transform .4s}
.lock-intro h1{font-size:clamp(19px,3.4vw,25px);color:var(--ink)}
.lock-intro .l-sub{font-size:13.5px;color:var(--ink-2);margin:0}
.lock-intro .l-date{font-size:12px;color:var(--ink-3);margin:0}

/* ============ tiny helpers ============ */
function $(s,r){return (r||document).querySelector(s);}
function el(t,a,kids){
  var n=document.createElement(t);
  if(Array.isArray(a)){ kids=a; a=null; }
  if(a) for(var k in a){
    if(k==="class") n.className=a[k];
    else if(k==="html") n.innerHTML=a[k];
    else if(k==="text") n.textContent=a[k];
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2),a[k]);
    else if(a[k]!==null&&a[k]!==undefined&&a[k]!==false) n.setAttribute(k,a[k]);
  }
  (kids||[]).forEach(function(c){ if(c===null||c===undefined||c===false) return;
    n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function esc(s){return String(s==null?"":s);}
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function parseD(s){ if(!s) return null; var p=String(s).split("-");
  if(p.length!==3) return null; var d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(0,0,0,0);
  return isNaN(d.getTime())?null:d; }
function iso(d){ var m=d.getMonth()+1,y=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(y<10?"0":"")+y; }
function fmtDate(s){ var d=parseD(s); if(!d) return "—";
  return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function dayName(s){ var d=parseD(s); return d?DAYS[d.getDay()]:""; }
function fmtDT(s){ if(!s) return "—"; var p=String(s).split("T");
  return dayName(p[0])+" "+fmtDate(p[0])+(p[1]?" — الساعة "+p[1]:""); }
/* أيام العمل: تتخطى الجمعة والسبت */
function addWorkDays(fromISO,n){
  var d=parseD(fromISO)||today(), added=0, guard=0;
  n=Math.max(0,Number(n)||0);
  while(added<n&&guard++<400){ d.setDate(d.getDate()+1); if(!WEEKEND[d.getDay()]) added++; }
  return iso(d);
}
function workDaysLeft(toISO){
  var t=parseD(toISO); if(!t) return null;
  var d=today(), n=0, guard=0;
  if(t<d){ var x=new Date(t);
    while(x<d&&guard++<400){ x.setDate(x.getDate()+1); if(!WEEKEND[x.getDay()]) n--; }
    return n; }
  var y=new Date(d);
  while(y<t&&guard++<400){ y.setDate(y.getDate()+1); if(!WEEKEND[y.getDay()]) n++; }
  return n;
}
function diffDays(s){ var d=parseD(s); if(!d) return null;
  return Math.round((d-today())/86400000); }
function hijri(d){
  try{ return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura",
      {day:"numeric",month:"long",year:"numeric"}).format(d)+" هـ"; }
  catch(e){ return ""; }
}
function initials(n){ var p=String(n||"؟").trim().split(/\s+/);
  return (p[0]||"").slice(0,1)+((p[1]||"").slice(0,1)); }
function waPhone(raw){
  var d=String(raw||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.indexOf("00")===0) d=d.slice(2);
  if(d.indexOf("0")===0) d="966"+d.slice(1);
  else if(d.length===9&&d.indexOf("5")===0) d="966"+d;
  return d;
}

/* ============ store (shared db, local fallback) ============ */
var DB=null, MODE="loading", MODE_FB=false, MODE_ERR="";
var S={staff:{},projects:{},notes:{},reviews:{},logs:{},orders:{},briefs:{},meta:{}};
var AUDIT={};
var ASSETS=null;
var subs=[];

function loadLocal(){
  try{ var raw=localStorage.getItem(LS_DATA); if(raw){ var o=JSON.parse(raw);
    S.staff=o.staff||{}; S.projects=o.projects||{}; S.notes=o.notes||{};
    S.reviews=o.reviews||{}; S.logs=o.logs||{}; S.orders=o.orders||{};
    S.briefs=o.briefs||{}; S.meta=o.meta||{}; AUDIT=o.audit||{}; } }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS_DATA,JSON.stringify(Object.assign({},S,{audit:AUDIT}))); }catch(e){}
}
/* --- السجل الداخلي: يوثّق كل تعديل بالتاريخ ولا يظهر في صفحات البرنامج --- */
var auditBuf=[], auditTimer=null;
function labelOf(coll,id,data){
  var d=data||S[coll][id]||{};
  if(coll==="projects") return (d.name||"")+(d.code?" ("+d.code+")":"");
  if(coll==="staff") return d.name||"";
  if(coll==="orders") return (d.type||"أمر")+" — "+(d.projectRef||d.title||"");
  if(coll==="reviews"){ var p=S.projects[d.projectId]; return (d.authority||"")+(p?" — "+p.name:""); }
  if(coll==="logs"){ var q=S.projects[d.projectId]; return "ملاحظات "+(d.date||"")+(q?" — "+q.name:""); }
  if(coll==="notes"){ var r=S.projects[d.projectId]; return "تنبيه"+(r?" — "+r.name:""); }
  if(coll==="briefs"){ var b=S.projects[d.projectId];
    return "متطلبات "+(d.clientName||"عميل")+(b?" — "+b.name:""); }
  return id;
}
function diffFields(oldD,newD){
  if(!oldD) return "";
  var out=[];
  for(var k in newD){
    if(FIELD_SKIP[k]) continue;
    var a=oldD[k], b=newD[k];
    var same=(typeof a==="object"||typeof b==="object")?
      (JSON.stringify(a)===JSON.stringify(b)):(String(a==null?"":a)===String(b==null?"":b));
    if(!same) out.push(FIELD_AR[k]||k);
  }
  return out.slice(0,8).join("، ");
}
function audit(act,coll,id,label,det){
  if(!meId) return;
  var m=me();
  auditBuf.push({at:Date.now(),by:meId,byName:(m&&m.name)||"",role:(m&&m.role)||"",
    act:act,ent:coll,eid:id,label:label||"",det:det||""});
  clearTimeout(auditTimer); auditTimer=setTimeout(flushAudit,700);
}
async function flushAudit(){
  if(!auditBuf.length) return;
  var items=auditBuf.splice(0), day=iso(today());
  var list=[];
  if(DB){
    try{ var d=await DB.collection("audit").doc(day).get();
      var ex=(typeof d.exists==="function")?d.exists():d.exists;
      if(ex) list=((d.data()||{}).items||[]).slice(); }catch(e){}
  } else list=((AUDIT[day]||{}).items||[]).slice();
  list=list.concat(items);
  if(list.length>500) list=list.slice(-500);
  AUDIT[day]={date:day,items:list,updatedAt:Date.now()};
  if(DB){ DB.collection("audit").doc(day).set({date:day,items:list,updatedAt:Date.now()}).catch(function(){}); }
  else saveLocal();
}

function put(coll,id,data,quiet){
  var old=S[coll][id];
  S[coll][id]=Object.assign({},data,{id:id});
  render();
  if(!quiet) audit(old?"تعديل":"إضافة",coll,id,labelOf(coll,id,data),
    old?diffFields(old,data):"");
  if(DB){ return DB.collection(coll).doc(id).set(data).catch(dbErr); }
  saveLocal(); return Promise.resolve();
}
function patch(coll,id,data,quiet){
  var cur=S[coll][id]||{};
  return put(coll,id,Object.assign({},cur,data),quiet);
}
function remove(coll,id,quiet){
  if(!quiet) audit("حذف",coll,id,labelOf(coll,id),"");
  delete S[coll][id]; render();
  if(DB){ return DB.collection(coll).doc(id).delete().catch(dbErr); }
  saveLocal(); return Promise.resolve();
}
function dbErr(e){
  var c=e&&e.code;
  var msg = c==="quota_exceeded" ? "امتلأت مساحة قاعدة البيانات — احذف مشاريع أو ملاحظات قديمة."
        : c==="resource_exhausted" ? "عدد كبير من العمليات في وقت واحد — انتظر لحظة وأعد المحاولة."
        : c==="invalid_argument" ? "لا تملك صلاحية هذا التعديل أو أن البيانات غير صحيحة."
        : "تعذّر حفظ التغيير على الخادم — تحقق من الاتصال وأعد المحاولة.";
  toast(msg,true);
}
function watch(coll){
  return DB.collection(coll).onSnapshot(function(snap){
    var m={};
    snap.docs.forEach(function(d){ m[d.id]=Object.assign({},d.data(),{id:d.id}); });
    S[coll]=m; render();
  }, function(e){
    if(e&&e.code==="revoked"){ MODE="revoked"; render(); }
  });
}
/* ---- تشغيل خارج claude.ai (مثل GitHub Pages) عبر Firebase اختياري ---- */
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement("script"); s.src=src; s.async=true;
    s.onload=res; s.onerror=function(){rej(new Error("load "+src));};
    document.head.appendChild(s);
  });
}
var FBV="10.12.2";
var LS_FB="mirqab.fb.v1";
/* إعدادات الاتصال: من ملف الإعداد، أو محفوظة على هذا الجهاز (لا تُنشر في المستودع) */
function fbCfg(){
  var c=window.MIRQAB_FB;
  if(c&&c.apiKey) return c;
  try{ var raw=localStorage.getItem(LS_FB); if(raw){ var o=JSON.parse(raw);
    if(o&&o.apiKey) return o; } }catch(e){}
  return null;
}
function saveFbCfg(o){ try{ localStorage.setItem(LS_FB,JSON.stringify(o)); }catch(e){} }
function clearFbCfg(){ try{ localStorage.removeItem(LS_FB); }catch(e){} }
async function initFirebase(cfg){
  if(!(window.firebase&&window.firebase.apps&&window.firebase.apps.length)){
    await loadScript("https://www.gstatic.com/firebasejs/"+FBV+"/firebase-app-compat.js");
    await loadScript("https://www.gstatic.com/firebasejs/"+FBV+"/firebase-auth-compat.js");
    await loadScript("https://www.gstatic.com/firebasejs/"+FBV+"/firebase-firestore-compat.js");
    try{ await loadScript("https://www.gstatic.com/firebasejs/"+FBV+"/firebase-storage-compat.js"); }catch(e){}
    window.firebase.initializeApp(cfg);
  }
  /* قواعد الحماية تشترط تسجيل دخول — دخول مجهول تلقائي لكل جهاز */
  await new Promise(function(res,rej){
    var auth=window.firebase.auth();
    var off=auth.onAuthStateChanged(function(u){ if(u){ off(); res(u); } });
    auth.signInAnonymously().catch(function(e){ off(); rej(e); });
    setTimeout(function(){ off(); rej(new Error("auth timeout")); },20000);
  });
  return true;
}
function fbAssets(){
  if(!(window.firebase&&window.firebase.storage)) return null;
  var st=window.firebase.storage();
  return {
    upload:function(file){
      var name="uploads/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+
        String(file.name||"file").replace(/[^\w.\-]/g,"_");
      var ref=st.ref(name);
      return ref.put(file).then(function(){ return ref.getDownloadURL(); })
        .then(function(url){ return {id:name,url:url,sizeBytes:file.size,contentType:file.type}; });
    },
    list:function(){ return Promise.resolve({assets:[],usage:{files:0,bytes:0,maxFiles:0,maxBytes:0}}); },
    "delete":function(ref){ return st.ref(ref).delete().then(function(){return {deleted:true};},
      function(){return {deleted:false};}); }
  };
}
async function initStore(){
  var cfg=fbCfg();
  if(cfg&&cfg.apiKey){
    try{
      await initFirebase(cfg);
      DB=window.firebase.firestore(); MODE="shared"; MODE_FB=true;
      subs=[watch("staff"),watch("projects"),watch("notes"),watch("reviews"),
            watch("logs"),watch("orders"),watch("briefs"),watch("meta")];
      ASSETS=fbAssets();
      render(); return;
    }catch(e){
      MODE_ERR=(e&&e.code)||(e&&e.message)||"خطأ";
      toast("تعذّر الاتصال بقاعدة البيانات المشتركة — سيعمل البرنامج محلياً",true);
    }
  }
  var db=null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db=null; }
  if(db){ DB=db; MODE="shared";
    subs=[watch("staff"),watch("projects"),watch("notes"),watch("reviews"),
          watch("logs"),watch("orders"),watch("briefs"),watch("meta")]; }
  else { MODE="local"; loadLocal(); }
  render();
  try{ ASSETS = window.claude&&window.claude.use ? await window.claude.use("assets") : null; }
  catch(e){ ASSETS=null; }
  render();
}

/* ============ identity ============ */
var meId=null;
try{ meId=localStorage.getItem(LS_ID)||null; }catch(e){}
function me(){ return meId?S.staff[meId]||null:null; }
function isRoot(){ var m=me(); return !!m && m.role==="root"; }
function isBoss(){ var m=me(); return !!m && (m.role==="manager"||m.role==="root"); }
function roleName(r){ return r==="root"?"المسؤول الرئيسي":r==="manager"?"مهندس مسؤول":"موظف"; }
/* صلاحية إضافة وتعديل الموظفين: للمسؤول الرئيسي دائماً، وللمهندس المسؤول بأمر اختياري منه */
function canManageStaff(){
  var m=me(); if(!m) return false;
  if(m.role==="root") return true;
  return m.role==="manager" && !!(m.perms&&m.perms.staff);
}
/* صلاحية إضافة المشاريع وتعديلها: المسؤول الرئيسي والمهندس المسؤول دائماً،
   والموظف إذا منحه المسؤول الرئيسي هذه الصلاحية (مثل م. آسر) */
function canAddProject(){
  var m=me(); if(!m) return false;
  if(m.role==="root"||m.role==="manager") return true;
  return !!(m.perms&&m.perms.projects);
}
function canEditStaff(s){
  if(isRoot()) return true;
  if(!canManageStaff()) return false;
  return s.role==="staff";
}
/* بوابة الرقم السري لإدارة الفريق وحساب المدير — مرة واحدة لكل جلسة */

/* قائمة أسماء الفريق لا تظهر إلا للمدير (ومن منحه صلاحية إدارة الفريق) */
function rosterVisible(){ return canManageStaff(); }
/* من يمكن إسناد العمل إليه: الروستر كاملاً للمدير، وإلا من هم على المشروع فقط */
function pickPeople(p){
  if(rosterVisible()) return staffList();
  var seen={}, out=[];
  function add(id){ if(id&&!seen[id]&&S.staff[id]&&!isContact(S.staff[id])){ seen[id]=1; out.push(S.staff[id]); } }
  add(meId);
  /* من يملك صلاحية إضافة المشاريع يرى الرسامين فقط ليوزّع عليهم — بلا بقية المهندسين */
  if(canAddProject()) for(var k in S.staff) if(isDraftsman(S.staff[k])) add(k);
  if(p){
    add(p.assigneeId); add(p.managerId);
    (p.team||[]).forEach(function(t){ add(t.staffId); });
    (p.tasks||[]).forEach(function(t){ add(t.assigneeId); });
  }
  return out;
}

/* ما يراه كل مستخدم: المدير يرى الكل، وكل مهندس يرى أعماله فقط */
function canSeeProject(p){
  if(isRoot()) return true;
  if(!meId||!p) return false;
  if(p.managerId===meId||p.assigneeId===meId) return true;
  if((p.team||[]).some(function(t){return t.staffId===meId;})) return true;
  if((p.tasks||[]).some(function(t){return t.assigneeId===meId;})) return true;
  return false;
}

var LS_THEME="mirqab.theme.v1", THEME="auto";
try{ THEME=localStorage.getItem(LS_THEME)||"auto"; }catch(e){}

/* ============ الدخول بالرقم السري + القفل التلقائي بعد 10 دقائق ============ */
var IDLE_MS=10*60*1000, LS_ACT="mirqab.act.v1";
var UNLOCKED=false, LAST_ACT=0, IDLE_WARNED=false, FAILS=0, FAIL_UNTIL=0, LOCK=null, LOCK_MSG="";
try{
  var _t=Number(localStorage.getItem(LS_ACT))||0;
  if(meId && _t && Date.now()-_t<IDLE_MS){ UNLOCKED=true; LAST_ACT=_t; }
}catch(e){}
var _actSaved=0;
function markActive(force){
  if(!UNLOCKED) return;
  var n=Date.now(); LAST_ACT=n; IDLE_WARNED=false;
  if(force||n-_actSaved>15000){ _actSaved=n; try{localStorage.setItem(LS_ACT,String(n));}catch(e){} }
}
["pointerdown","keydown","wheel","touchstart","scroll"].forEach(function(ev){
  window.addEventListener(ev,function(){ markActive(); },{passive:true,capture:true}); });
var _mv=0;
window.addEventListener("mousemove",function(){ var n=Date.now(); if(n-_mv>4000){ _mv=n; markActive(); } },{passive:true});
function idleCheck(){
  if(!UNLOCKED) return;
  var idle=Date.now()-LAST_ACT;
  if(idle>=IDLE_MS) return lockNow(true);
  if(idle>=IDLE_MS-30000 && !IDLE_WARNED){ IDLE_WARNED=true;
    toast("سيُقفل النظام خلال 30 ثانية لعدم النشاط — حرّك الفأرة للاستمرار"); }
}
setInterval(idleCheck,5000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) idleCheck(); });

function lockNow(idle){
  UNLOCKED=false; ROOT_UNLOCKED=false; ADMIN_OPEN=false;
  try{ localStorage.removeItem(LS_ACT); }catch(e){}
  closeModal();
  LOCK_MSG = idle ? "أُقفل النظام تلقائياً بعد 10 دقائق من عدم النشاط" : "تم قفل البرنامج";
  render();
}
function lockBuild(){
  if(LOCK) return LOCK;
  var input=el("input",{type:"password",id:"lockCode",maxlength:"24",placeholder:"••••••",
    autocomplete:"off",autocapitalize:"off",spellcheck:"false","aria-label":"الرقم السري"});
  var eye=el("button",{class:"eye",type:"button",title:"إظهار / إخفاء الرمز","aria-label":"إظهار الرمز",text:"👁",
    onclick:function(){ input.type=input.type==="password"?"text":"password"; input.focus(); }});
  var err=el("div",{class:"lock-err",role:"alert"});
  var msg=el("span",{class:"lock-msg"});
  var dateP=el("p",{class:"l-date"});
  var root=el("div",{class:"lock",id:"lock"},[
    el("div",{class:"lock-bg"}), el("div",{class:"lock-veil"}),
    el("div",{class:"lock-stage"},[
      el("div",{class:"lock-halo",onclick:function(){ lockEnter(); }},[el("div",{class:"lock-logo",role:"img","aria-label":OFFICE})]),
      el("div",{class:"lock-intro"},[
        msg,
        el("h1",{text:OFFICE}),
        el("p",{class:"l-sub",text:"إدارة مشاريع المكتب — أعمال مشاريع الهندسة المعمارية"}),
        dateP,
        el("button",{class:"btn primary",type:"button",onclick:function(){ lockEnter(); }},
          [el("span",{text:"🔒"}),el("span",{text:"الدخول بالرقم السري"})])
      ])
    ]),
    el("form",{class:"lock-card",autocomplete:"off",onsubmit:function(e){ e.preventDefault(); lockSubmit(); }},[
      el("h2",{text:"الدخول بالرقم السري"}),
      el("p",{text:"أدخل رمزك الخاص ليفتح البرنامج على صفحتك ومشاريعك ومهامك حسب صلاحياتك."}),
      el("div",{class:"lock-in"},[input,eye]),
      err,
      el("button",{class:"btn primary",type:"submit",text:"دخول"}),
      el("div",{class:"l-foot"},[
        el("button",{class:"btn ghost sm",type:"button",text:"رجوع",onclick:function(){ lockIntro(); }}),
        el("span",{text:"يُقفل تلقائياً بعد 10 دقائق من عدم النشاط"})
      ])
    ])
  ]);
  root.addEventListener("keydown",function(e){
    if(e.key==="Escape") lockIntro();
  });
  document.addEventListener("keydown",function(e){
    if(!LOCK||UNLOCKED||LOCK.root.classList.contains("entering")) return;
    if(e.key==="Enter"||(e.key&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey)) lockEnter();
  });
  input.addEventListener("input",function(){ err.textContent=""; });
  LOCK={root:root,input:input,err:err,msg:msg,dateP:dateP};
  document.body.appendChild(root);
  return LOCK;
}
function showLock(){
  var L=lockBuild(), t=today();
  L.dateP.textContent=DAYS[t.getDay()]+" "+t.getDate()+" "+MONTHS[t.getMonth()]+" "+t.getFullYear()+" · "+hijri(t);
  L.msg.textContent=LOCK_MSG?"🔒 "+LOCK_MSG:"";
  L.msg.style.display=LOCK_MSG?"":"none";
  document.body.classList.remove("wm");
  if(L.root.classList.contains("gone")||L.root.classList.contains("leaving")){
    L.root.classList.remove("gone","leaving","entering");
    L.input.value=""; L.err.textContent="";
  }
}
function hideLock(){
  document.body.classList.add("wm");
  if(!LOCK||LOCK.root.classList.contains("gone")) return;
  var r=LOCK.root;
  r.classList.add("leaving");
  LOCK.input.value=""; LOCK.input.blur(); LOCK_MSG="";
  setTimeout(function(){ if(UNLOCKED) r.classList.add("gone"); },900);
}
function lockEnter(){
  var L=lockBuild(); L.root.classList.add("entering");
  setTimeout(function(){ try{ L.input.focus(); }catch(e){} },80);
}
function lockIntro(){
  if(!LOCK) return;
  LOCK.root.classList.remove("entering"); LOCK.input.value=""; LOCK.err.textContent=""; LOCK.input.blur();
}
function lockErr(t){
  if(!LOCK) return;
  LOCK.err.textContent=t;
  LOCK.root.classList.remove("shake"); void LOCK.root.offsetWidth; LOCK.root.classList.add("shake");
  LOCK.input.select();
}
function lockSubmit(){
  var v=String(LOCK.input.value||"").trim();
  if(!v) return lockErr("أدخل الرقم السري");
  if(MODE==="loading") return lockErr("جارٍ الاتصال بقاعدة البيانات — حاول بعد لحظة");
  if(Date.now()<FAIL_UNTIL) return lockErr("محاولات كثيرة — انتظر "+Math.ceil((FAIL_UNTIL-Date.now())/1000)+" ثانية");
  var all=[]; for(var k in S.staff) if(!isContact(S.staff[k])) all.push(S.staff[k]);
  var hit=all.filter(function(x){ return x.pin && String(x.pin).trim()===v; });
  if(!hit.length){
    /* تشغيل أول: إن لم يُحدَّد رمز للمسؤول الرئيسي بعد يُقبل الرقم السري للنظام الرئيسي */
    var roots=all.filter(function(x){ return x.role==="root"; });
    if(v===ROOT_CODE && roots.length && !roots.some(function(x){ return x.pin&&String(x.pin).trim(); })) hit=[roots[0]];
  }
  if(hit.length>1) return lockErr("هذا الرمز مسجّل لأكثر من حساب — راجع المدير المسؤول");
  if(!hit.length){
    FAILS++;
    if(FAILS>=5){ FAILS=0; FAIL_UNTIL=Date.now()+30000; return lockErr("5 محاولات خاطئة — انتظر 30 ثانية"); }
    return lockErr("الرقم السري غير صحيح");
  }
  FAILS=0;
  var who=hit[0];
  meId=who.id; try{ localStorage.setItem(LS_ID,who.id); }catch(e){}
  ROOT_UNLOCKED=false; ADMIN_OPEN=false;
  UNLOCKED=true; markActive(true);
  V.tab = who.role==="staff" ? "desk" : "projects";
  render();
  toast("أهلاً "+who.name);
}

/* ============ derived ============ */
function allProjects(){ var a=[]; for(var k in S.projects) a.push(S.projects[k]); return a; }
function projList(){ return allProjects().filter(canSeeProject); }
function isContact(s){ return !!s && s.kind==="contact"; }
function contactList(){
  var a=[]; for(var k in S.staff) if(isContact(S.staff[k])) a.push(S.staff[k]);
  a.sort(function(x,y){ return String(x.name||"").localeCompare(String(y.name||""),"ar"); });
  return a;
}
function isDraftsman(s){ return !!s && /رسام/.test(String(s.specialty||"")+" "+String(s.title||"")); }
/* من يحق لهذا المستخدم إرسال التنبيهات والرسائل إليه */
function msgScope(){
  var m=me(); if(!m) return "none";
  if(m.role==="root") return "all";
  return (m.perms&&m.perms.msgScope)||"all";
}
function canMessage(id){
  var sc=msgScope(); if(sc==="all") return true;
  if(sc==="none") return false;
  if(id===meId) return true;
  return isDraftsman(S.staff[id]);
}
function msgPeople(list){
  if(msgScope()==="all") return list;
  return list.filter(function(s){ return canMessage(s.id); });
}
function staffList(){
  var a=[]; for(var k in S.staff) a.push(S.staff[k]);
  a=a.filter(function(s){ return !isContact(s); });
  if(!isRoot()) a=a.filter(function(s){ return s.role!=="root"; });
  var rk={root:0,manager:1,staff:2};
  a.sort(function(x,y){ return ((rk[x.role]||2)-(rk[y.role]||2)) ||
    String(x.name||"").localeCompare(String(y.name||""),"ar"); });
  return a;
}
function noteList(){
  var a=[]; for(var k in S.notes) a.push(S.notes[k]);
  if(!isRoot()) a=a.filter(function(n){
    if(n.toId===meId||n.fromId===meId) return true;
    return n.projectId?canSeeProject(S.projects[n.projectId]):false; });
  a.sort(function(x,y){ return (y.createdAt||0)-(x.createdAt||0); });
  return a;
}
function wsOf(p){
  if(p.workState) return p.workState;
  return p.stage==="مكتمل"?"مكتمل":"قيد العمل";
}
/* لون الحالة: أحمر = متأخر أو لم يُستكمل في وقته · برتقالي = قيد العمل
   أخضر = مكتمل · رمادي = متوقف حتى يُذكر السبب */
function statusOf(p){
  var ws=wsOf(p);
  if(ws==="متوقف"){
    var r=(p.pauseReason||"").trim();
    return {k:"paused",cls:"pause",label:"متوقف",sub:r?"بسبب مسجّل":"أضف السبب",needReason:!r,reason:r};
  }
  if(ws==="مكتمل"||p.stage==="مكتمل"){
    var lateDone=false;
    if(p.completedAt&&p.dueDate){ var c=new Date(p.completedAt); c.setHours(0,0,0,0);
      lateDone=c>parseD(p.dueDate); }
    return {k:"done",cls:"done",label:"مكتمل",sub:lateDone?"سُلّم متأخراً":"في وقته"};
  }
  var d=diffDays(p.dueDate);
  if(d===null) return {k:"work",cls:"work",label:"قيد العمل",sub:"بلا موعد"};
  if(d<0) return {k:"late",cls:"late",label:"متأخر "+Math.abs(d)+" يوم",sub:"لم يُستكمل في وقته",n:Math.abs(d)};
  if(d===0) return {k:"today",cls:"today",label:"يستحق اليوم",sub:"آخر يوم",n:0};
  return {k:"work",cls:"work",label:"قيد العمل",sub:"بعد "+d+" يوم",n:d};
}
function stageP(s){ for(var i=0;i<STAGES.length;i++) if(STAGES[i].k===s) return STAGES[i].p; return 0; }
function counts(){
  var c={late:0,today:0,work:0,paused:0,done:0};
  projList().forEach(function(p){ c[statusOf(p).k]++; });
  return c;
}
function noReasonList(){
  return projList().filter(function(p){ return statusOf(p).needReason; });
}
function canEdit(p){ return isBoss() || (p && (p.managerId===meId)); }

/* ---- الموافقات المبدئية وملاحظات الجهة ---- */
function revList(){
  var a=[]; for(var k in S.reviews) a.push(S.reviews[k]);
  if(!isRoot()) a=a.filter(function(r){ return canSeeProject(S.projects[r.projectId]); });
  a.sort(function(x,y){
    var rx=revClock(x), ry=revClock(y);
    if(rx.closed!==ry.closed) return rx.closed?1:-1;
    return (rx.left===null?9999:rx.left)-(ry.left===null?9999:ry.left);
  });
  return a;
}

/* الشريط: يبدأ أخضر يوم تسجيل الملاحظة وينتهي أحمر عند انتهاء الفترة المقدرة */
function revClock(r){
  var closed = r.status==="موافقة مبدئية"||r.status==="مرفوضة"||r.status==="أُعيد الإرسال";
  var start = r.remarkDate||null;
  var win = Number(r.windowDays)||DEF_WINDOW;
  if(!start) return {closed:closed,left:null,pct:0,cls:closed?"done":"pause",
    label:closed?"مغلقة":"بانتظار نزول الملاحظات من الجهة"};
  var sd=parseD(start); if(!sd) return {closed:closed,left:null,pct:0,cls:"pause",label:"—"};
  var used=Math.round((today()-sd)/86400000);
  var left=win-used;
  var pct=Math.max(0,Math.min(100,Math.round((left/win)*100)));
  if(closed) return {closed:true,left:left,pct:100,win:win,used:used,
    cls:r.status==="مرفوضة"?"late":(r.status==="أُعيد الإرسال"?"pause":"done"),
    label:r.status==="مرفوضة"?"مرفوضة":(r.status==="أُعيد الإرسال"?"أُعيدت للجهة":"معتمدة مبدئياً")};
  var cls = left<=0?"late":(left<=3?"work":"done");
  var label = left<0 ? "تجاوز المهلة بـ "+Math.abs(left)+" يوم"
    : left===0 ? "اليوم آخر يوم للإرسال"
    : "متبقٍ "+left+" يوم من "+win;
  return {closed:false,left:left,pct:pct,cls:cls,win:win,used:used,label:label};
}

  return !c.closed && c.left!==null && c.left<=0; }); }

function parseCfgText(t){
  t=String(t||"").trim();
  if(!t) return null;
  /* رمز ربط مضغوط (Base64) */
  if(/^[A-Za-z0-9+/=]+$/.test(t)&&t.length>60){
    try{ var d=decodeURIComponent(escape(atob(t))); var o=JSON.parse(d);
      if(o&&o.apiKey) return o; }catch(e){}
  }
  try{ var j=JSON.parse(t); if(j&&j.apiKey) return j; }catch(e){}
  /* نص firebaseConfig كما يُنسخ من Firebase */
  var out={}, keys=["apiKey","authDomain","projectId","storageBucket",
    "messagingSenderId","appId","measurementId"];
  keys.forEach(function(k){
    var m=t.match(new RegExp(k+"\\s*:\\s*[\"']([^\"']+)[\"']"));
    if(m) out[k]=m[1];
  });
  return out.apiKey?out:null;
}
function cfgCode(o){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }catch(e){ return ""; }
}

async function saveFile(filename,text,mime){
  var dl=null;
  try{ dl = window.claude&&window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(dl){
    try{ await dl.save({filename:filename,data:text}); toast("تم حفظ الملف: "+filename); return true; }
    catch(e){
      var c=e&&e.code;
      if(c==="declined"||c==="cancelled"){ toast("أُلغي الحفظ"); return false; }
      if(c==="rate_limited"){ toast("نافذة حفظ أخرى مفتوحة — أكملها ثم أعد المحاولة",true); return false; }
      if(c==="rejected_extension"||c==="extension_not_enabled"){
        toast("صيغة الملف غير مسموح بحفظها هنا",true); return false; }
    }
  }
  try{
    var b=(text instanceof Blob)?text:new Blob([text],{type:mime||"application/json;charset=utf-8"});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a"); a.href=u; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},4000);
    toast("تم حفظ الملف: "+filename);
    return true;
  }catch(e){ toast("تعذّر حفظ الملف على هذا الجهاز",true); return false; }
}

  var rows=[head.map(csvCell).join(",")];
  applyFilters(projList()).forEach(function(p){
    var st=statusOf(p), a=S.staff[p.assigneeId];
    rows.push([p.code,p.name,p.client,p.type,p.stage,wsOf(p),p.pauseReason||"",p.priority,
      p.startDate,p.dueDate,dayName(p.dueDate),st.label,personName(p.assigneeId),

/* --- كاتب ملفات ZIP مدمج (لا يعتمد على أي مكتبة خارجية) --- */
function crc32(u8){
  var t=crc32.t;
  if(!t){ t=crc32.t=new Int32Array(256);
    for(var n=0;n<256;n++){ var c=n;
      for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      t[n]=c; } }
  var r=-1;
  for(var i=0;i<u8.length;i++) r=(r>>>8)^t[(r^u8[i])&255];
  return (r^-1)>>>0;
}
async function toU8(d){
  if(typeof d==="string") return new TextEncoder().encode(d);
  if(d instanceof Uint8Array) return d;
  if(d instanceof ArrayBuffer) return new Uint8Array(d);
  if(d && typeof d.arrayBuffer==="function") return new Uint8Array(await d.arrayBuffer());
  return new TextEncoder().encode(String(d));
}
async function makeZip(entries){
  var enc=new TextEncoder(), local=[], central=[], offset=0, now=new Date();
  var tm=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
  var dt=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  for(var i=0;i<entries.length;i++){
    var data=await toU8(entries[i].data);
    var name=enc.encode(entries[i].name);
    var crc=crc32(data);
    var lh=new Uint8Array(30+name.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint16(8,0,true); lv.setUint16(10,tm,true); lv.setUint16(12,dt,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true); lv.setUint16(28,0,true);
    lh.set(name,30);
    local.push(lh,data);
    var ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true);
    cv.setUint16(12,tm,true); cv.setUint16(14,dt,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true);
    cv.setUint32(42,offset,true);
    ch.set(name,46);
    central.push(ch);
    offset+=lh.length+data.length;
  }
  var cdSize=0; central.forEach(function(c){cdSize+=c.length;});
  var end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true); ev.setUint16(20,0,true);
  return new Blob(local.concat(central,[end]),{type:"application/zip"});
}

    (bf.attachments||[]).forEach(function(im){ imgs.push({n:"مرفق العميل",im:im}); });
  }
  for(var j=0;j<imgs.length;j++){
    try{

function saveDialog(title){

  ]);
  openModal(node);
  return {

      listEl.appendChild(el("div",{class:"sl "+(kind||"")},[

        el("span",{text:txt})]));

async function writeToDir(root,files,ui){
  for(var i=0;i<files.length;i++){
    var parts=files[i].name.split("/"), dir=root;
    for(var k=0;k<parts.length-1;k++) dir=await dir.getDirectoryHandle(parts[k],{create:true});
    var fh=await dir.getFileHandle(parts[parts.length-1],{create:true});
    var w=await fh.createWritable(); await w.write(files[i].blob); await w.close();
    if(ui) ui.step("كُتب: "+files[i].name,"ok");
  }
}
async function saveProjectFolder(p,ui,silent){
  ui=ui||(silent?null:saveDialog("حفظ ملف المشروع — "+p.name));
  var folder=projFolderName(p);
  var files;
  if(ui) ui.step("تجهيز ملفات المجلد: "+folder);
  try{ files=await buildProjectFiles(p); }
  catch(e){ if(ui) ui.step("تعذّر تجهيز الملفات: "+(e&&e.message||e),"bad"); return false; }
  if(!files.length){ if(ui) ui.step("لا توجد بيانات كافية لبناء الملف","bad"); return false; }
  if(ui) ui.step("جاهز: "+files.length+" ملف","ok");

  if(DIRH){
    try{
      var perm=DIRH.queryPermission?await DIRH.queryPermission({mode:"readwrite"}):"granted";
      if(perm!=="granted"&&DIRH.requestPermission) perm=await DIRH.requestPermission({mode:"readwrite"});
      if(perm==="granted"){
        var root=await DIRH.getDirectoryHandle(folder,{create:true});
        await writeToDir(root,files,ui);
        patch("projects",p.id,{folderName:folder,folderSavedAt:Date.now()});
        if(ui){ ui.step("حُفظ المجلد داخل: "+DIRNAME,"ok");
          ui.actions([el("button",{class:"btn primary",text:"معاينة الملف",onclick:function(){previewProject(p);}})]); }
        return true;
      }
      if(ui) ui.step("لم تُمنح صلاحية الكتابة في المجلد — سيُحفظ ملف مضغوط","bad");
    }catch(e){ if(ui) ui.step("تعذّرت الكتابة في المجلد ("+(e&&e.name||"خطأ")+") — سيُحفظ ملف مضغوط","bad"); }
  } else if(ui) ui.step("لم يُحدَّد مجلد على الجهاز — سيُحفظ ملف مضغوط تفكّه في المكان الذي تريد");

  var entries=files.map(function(x){ return {name:folder+"/"+x.name,data:x.blob}; });
  var blob=await makeZip(entries);
  if(ui) ui.step("حُزم المجلد ("+Math.round(blob.size/1024)+" ك.ب) — أكّد الحفظ من نافذة المتصفح");
  var okSave=await saveFile(folder+".zip",blob,"application/zip");
  if(ui){
    if(okSave) ui.step("تم حفظ "+folder+".zip على جهازك","ok");
    else ui.step("لم يكتمل الحفظ — أعد المحاولة أو استخدم «معاينة الملف» ثم طباعته","bad");
    ui.actions([el("button",{class:"btn primary",text:"معاينة الملف",onclick:function(){previewProject(p);}})]);
  }
  patch("projects",p.id,{folderName:folder,folderSavedAt:Date.now()});
  return okSave;
}
async function saveAllFolders(list){
  var ui=saveDialog("حفظ ملفات "+list.length+" مشروع");
  if(DIRH){
    for(var i=0;i<list.length;i++){ ui.step("— "+list[i].name);
      await saveProjectFolder(list[i],ui); }
    ui.step("انتهى حفظ "+list.length+" مجلد داخل "+DIRNAME,"ok");
    return;
  }
  ui.step("تجهيز مجلدات المشاريع في ملف مضغوط واحد…");
  var entries=[];
  for(var j=0;j<list.length;j++){
    try{
      var fl=await buildProjectFiles(list[j]);
      var fn=projFolderName(list[j]);
      fl.forEach(function(x){ entries.push({name:fn+"/"+x.name,data:x.blob}); });
      ui.step(fn+" — "+fl.length+" ملف","ok");
    }catch(e){ ui.step("تعذّر تجهيز: "+list[j].name,"bad"); }
  }
  if(!entries.length){ ui.step("لا توجد ملفات للحفظ","bad"); return; }
  var blob=await makeZip(entries);
  ui.step("الحجم: "+Math.round(blob.size/1024)+" ك.ب — أكّد الحفظ من نافذة المتصفح");
  var ok=await saveFile("مشاريع المكتب "+iso(today())+".zip",blob,"application/zip");
  ui.step(ok?"تم حفظ الملف المضغوط على جهازك":"لم يكتمل الحفظ — أعد المحاولة",ok?"ok":"bad");
}

function importJSON(){
  var f=el("input",{id:"impFile",type:"file",accept:".json,application/json"});

  var data=null;
  f.addEventListener("change",function(){
    var file=f.files&&f.files[0]; if(!file) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        if(!o||typeof o!=="object"||!o.projects) throw new Error("bad");
        data=o;
        info.textContent="الملف يحتوي "+Object.keys(o.projects||{}).length+" مشروع و "+
          Object.keys(o.staff||{}).length+" موظف و "+Object.keys(o.notes||{}).length+" ملاحظة.";
      }catch(e){ data=null; info.textContent="الملف غير صالح — اختر ملف نسخة احتياطية صادر من البرنامج."; }
    };
    r.readAsText(file);
  });
  openModal(modal("استعادة نسخة احتياطية",[
    el("p",{style:"margin:0;font-size:13px;line-height:1.8;color:var(--ink-2)",

    field("ملف النسخة الاحتياطية (.json)",f,null,true), info
  ],[
    el("button",{class:"btn primary",text:"استعادة",onclick:function(){
      if(!data) return toast("اختر ملفاً صالحاً أولاً",true);
      var n=0;
      ["staff","projects","notes","reviews","logs","orders","briefs"].forEach(function(c){
        var src=data[c]||{};

      });
      closeModal(); toast("تمت استعادة "+n+" سجل");
    }}),
    el("button",{class:"btn",text:"إلغاء",onclick:closeModal})
  ]));
}

function alertReview(r){
  var p=S.projects[r.projectId];
  if(!p) return toast("المشروع غير موجود",true);
  var c=revClock(r);
  var lines=[];
  lines.push("ملاحظات "+r.authority+":");
  if(r.remarkDate) lines.push("تاريخ نزول الملاحظة: "+fmtDate(r.remarkDate)+" — "+dayName(r.remarkDate));
  lines.push("المهلة المقدرة للإرسال: "+(r.windowDays||DEF_WINDOW)+" يوم ("+c.label+")");
  if(r.remarks){ lines.push(""); lines.push("نص الملاحظات:"); lines.push(r.remarks); }
  if(r.affectsDesign){ lines.push(""); lines.push("تؤثر على التصميم — الآلية: "+(r.track||"—"));
    if(r.track===TRACKS[0]) lines.push("موافقة المالك: "+(r.ownerApproval||"بانتظار الرد"));
    if(r.track===TRACKS[1]&&r.meetingAt) lines.push("موعد الاجتماع مع الجهة: "+fmtDT(r.meetingAt)); }
  if(r.fixPlan){ lines.push(""); lines.push("آلية التعديل: "+r.fixPlan); }
  if(r.images&&r.images.length) lines.push("\nمرفق "+r.images.length+" صورة من الملاحظات داخل البرنامج.");
  alertForm(p,lines.join("\n"));
}

function teamForm(p){
  var team=(p.team||[]).map(function(x){return Object.assign({},x);});
  var tasks=(p.tasks||[]).map(function(x){return Object.assign({},x);});
  var people=pickPeople(p);
  var pOpts=people.map(function(s){return {v:s.id,t:s.name};});
  var tBox=el("div",{class:"picklist"});
  var kBox=el("div",{class:"picklist"});

  function drawTeam(){
    tBox.innerHTML="";
    if(!team.length) tBox.appendChild(el("span",{class:"hint",text:"لم يُضف أحد بعد."}));
    team.forEach(function(m,i){
      var who=sel("tm"+i,m.staffId,pOpts); who.addEventListener("change",function(){m.staffId=who.value;});
      var rl=sel("tr"+i,m.role||TEAM_ROLES[0],TEAM_ROLES); rl.addEventListener("change",function(){m.role=rl.value;});
      var tk=inp("tt"+i,m.task||"",{placeholder:"المهمة القائم عليها"});
      tk.addEventListener("input",function(){m.task=tk.value;});
      tBox.appendChild(el("div",{class:"pick",style:"display:grid;grid-template-columns:1.1fr 1.1fr 1.5fr auto;gap:8px;align-items:center"},[
        who,rl,tk,
        el("button",{class:"btn ghost sm danger",text:"✕",onclick:function(){team.splice(i,1);drawTeam();}})
      ]));
    });
  }
  function drawTasks(){
    kBox.innerHTML="";
    if(!tasks.length) kBox.appendChild(el("span",{class:"hint",text:"لا توجد أعمال مسجّلة بعد."}));
    tasks.forEach(function(t,i){
      var ti=inp("kt"+i,t.title||"",{placeholder:"اسم العمل — مثال: مساقط الأدوار المتكررة"});
      ti.addEventListener("input",function(){t.title=ti.value;});
      var kn=sel("kk"+i,t.kind||WORK_KINDS[0],WORK_KINDS); kn.addEventListener("change",function(){t.kind=kn.value;});
      var wh=sel("kw"+i,t.assigneeId||(people[0]&&people[0].id),pOpts);

/* المدة المحددة لتقديم الفكرة المبدئية والتعديل */
function briefClock(b){
  if(!b||!b.showTerms) return null;
  var days=Number(b.ideaDays)||DEF_IDEA_DAYS;
  if(!b.sentAt) return {state:"wait",cls:"pause",label:"لم تُرسل للمهندس بعد",days:days};
  var due=b.ideaDue||addWorkDays(b.sentAt,days);
  if(b.ideaDoneAt){
    var lateDone=parseD(b.ideaDoneAt)>parseD(due);
    return {state:"done",cls:lateDone?"work":"done",due:due,days:days,
      label:"قُدّمت الفكرة "+fmtDate(b.ideaDoneAt)+(lateDone?" — بعد الموعد":" — في وقتها")};
  }
  var left=workDaysLeft(due);
  var cls = left<0?"late":(left<=1?"work":"done");
  var label = left<0 ? "تأخر التقديم "+Math.abs(left)+" يوم عمل"
    : left===0 ? "اليوم آخر موعد لتقديم الفكرة"
    : "متبقٍ "+left+" يوم عمل من "+days;
  return {state:left<0?"late":"open",cls:cls,due:due,left:left,days:days,label:label};
}
function briefsLate(){
  return briefList().filter(function(b){
    var c=briefClock(b); return c&&c.state==="late"; });
}

var WL={who:"all",work:true,late:true,paused:true,done:false,tasks:true};
function wlMatch(p,who){
  if(who==="all") return true;
  if(p.assigneeId===who||p.managerId===who) return true;
  if((p.team||[]).some(function(t){return t.staffId===who;})) return true;
  if((p.tasks||[]).some(function(t){return t.assigneeId===who;})) return true;
  return false;
}
function wlRows(){
  return projList().filter(function(p){
    if(!wlMatch(p,WL.who)) return false;
    var k=statusOf(p).k;
    if(k==="paused") return WL.paused;
    if(k==="done") return WL.done;
    if(k==="late"||k==="today") return WL.late;
    return WL.work;
  }).sort(sortProjects);
}
function wlProjectRow(p){
  var st=statusOf(p), a=S.staff[p.assigneeId], tk=taskList(p);
  var d=diffDays(p.dueDate);
  return {
    code:p.code||"", name:p.name||"", client:p.client||"", type:p.type||"",
    stage:p.stage||"", ws:wsOf(p),
    reason: wsOf(p)==="متوقف" ? ((p.pauseReason||"").trim()||"لم يُذكر السبب") : "—",
    status:st.label,
    lateDays:(st.k==="late"&&d!==null)?Math.abs(d):"",
    start:p.startDate||"", due:p.dueDate||"", day:p.dueDate?dayName(p.dueDate):"",
    prio:p.priority||"عادية", who:personName(p.assigneeId), phone:a?a.phone:"",
    mgr:personName(p.managerId),
    tTotal:tk.length,
    tDone:tk.filter(function(t){return t.status==="منجز";}).length,
    tWork:tk.filter(function(t){return t.status==="قيد التنفيذ";}).length,
    tNone:tk.filter(function(t){return t.status==="لم يبدأ";}).length,
    last:(projLogs(p.id)[0]||{}).date||""
  };
}
function exportWorkloadXLSX(){
  var head=["رقم المشروع","اسم المشروع","المالك","النوع","المرحلة","حالة العمل","سبب التوقف",
    "الحالة الزمنية","أيام التأخير","تاريخ البدء","تاريخ التسليم","يوم التسليم","الأولوية",
    "الموظف القائم","جوال الموظف","المهندس المسؤول","عدد الأعمال","منجز","قيد التنفيذ","لم يبدأ","آخر تطور"];
  var rows=[head];
  wlRows().forEach(function(p){ var r=wlProjectRow(p);
    rows.push([r.code,r.name,r.client,r.type,r.stage,r.ws,r.reason,r.status,r.lateDays,
      r.start,r.due,r.day,r.prio,r.who,r.phone,r.mgr,r.tTotal,r.tDone,r.tWork,r.tNone,r.last]); });

function alertForm(p,preset){
  var asg=S.staff[p.assigneeId];
  if(!asg) { toast("لم يُحدَّد موظف لهذا المشروع",true); return; }
  if(!canMessage(p.assigneeId)){
    toast("لا تملك صلاحية إرسال تنبيه لـ"+asg.name+" — صلاحيتك محصورة بـ"+
      (msgScope()==="draftsmen"?"الرسامين":"لا أحد"),true);
    return;
  }
  var stt=statusOf(p);
  var mine=me();
  var noteT=el("textarea",{id:"alNote",placeholder:"اكتب الملاحظة أو المطلوب من الموظف…"});
  noteT.value = preset || (stt.k==="late"
    ? "المشروع لم يُستكمل في الوقت المحدد. أفدني بوضع العمل الحالي وموعد الإنجاز."
    : stt.k==="today" ? "موعد تسليم المشروع اليوم. الرجاء رفع المخرجات النهائية."
    : stt.needReason ? "المشروع مسجّل كمتوقف بلا سبب. الرجاء استكمال سبب التوقف في البرنامج."
    : "");
  var box=el("div",{class:"msgbox"});
  var act=sel("alAct","تعديل",ACTIONS);
  var showTime=el("input",{id:"alTime",type:"checkbox"});
  function compose(){
    var L=[];
    L.push("السلام عليكم ورحمة الله");
    L.push("");
    L.push("إجراء المعاملة من المهندس "+asg.name);
    L.push("رقم المشروع: "+(p.code||"—"));
    L.push("اسم المشروع: "+p.name);
    L.push("الإجراء المطلوب: "+act.value);
    if(showTime.checked){
      L.push("تاريخ التسليم: "+fmtDate(p.dueDate)+" — "+dayName(p.dueDate));
      L.push("المدة: "+stt.label);
    }
    if(noteT.value.trim()){ L.push(""); L.push(noteT.value.trim()); }
    L.push("");
    L.push("وشكراً لكم — "+(mine?mine.name:""));
    return L.join("\n");
  }
  function refresh(){ box.textContent=compose(); }
  noteT.addEventListener("input",refresh);
  act.addEventListener("change",refresh);
  showTime.addEventListener("change",refresh);
  refresh();
  var phone=waPhone(asg.phone);

  openModal(modal("تنبيه "+asg.name,[
    el("div",{style:"display:flex;gap:10px;align-items:center"},[
      el("span",{class:"av",text:initials(asg.name)}),
      el("span",{style:"flex:1"},[
        el("b",{style:"display:block;font-size:14px",text:asg.name}),
        el("small",{class:"num",style:"color:var(--ink-3);font-size:12px",text:asg.phone||"لا يوجد رقم"})
      ]),
      el("span",{class:"pill "+stt.cls,text:stt.label})
    ]),
    el("div",{class:"f-grid"},[
      el("div",{class:"field"},[el("label",{text:"الإجراء المراد تقديمه"}),act]),
      el("div",{class:"field"},[el("label",{text:"المدة الزمنية"}),
        el("label",{style:"display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;padding-top:6px"},
          [showTime,el("span",{text:"ذكر المدة وتاريخ التسليم في الرسالة"})])])
    ]),
    field("الملاحظة",noteT,null,true),
    el("div",{class:"field full"},[ el("label",{text:"نص الرسالة"}), box ])
  ],[
    el("button",{class:"btn primary",text:"تسجيل التنبيه في البرنامج",onclick:function(){
      var id=uid();
      put("notes",id,{projectId:p.id,text:noteT.value.trim()||stt.label,fromId:meId||"",toId:p.assigneeId,
        kind:"alert",createdAt:Date.now(),readAt:null});
      closeModal(); toast("تم تسجيل التنبيه — سيظهر لـ"+asg.name+" عند فتح البرنامج");
    }}),
    phone?el("a",{class:"btn",href:"https://wa.me/"+phone+"?text="+encodeURIComponent(compose()),
      target:"_blank",rel:"noopener",style:"text-decoration:none",text:"فتح واتساب",onclick:function(){
        var id=uid();
        put("notes",id,{projectId:p.id,text:noteT.value.trim()||stt.label,fromId:meId||"",toId:p.assigneeId,
          kind:"alert",createdAt:Date.now(),readAt:null});
        setTimeout(closeModal,150);
      }}):el("span",{class:"pill",text:"أضف رقم جوال للموظف لتفعيل واتساب"}),

}

/* ============ rendering ============ */
var _rendering=false,_dirty=false;
function render(){
  if(_rendering){ _dirty=true; return; }      /* يمنع تكرار القوائم عند تداخل التحديثات */
  _rendering=true;
  try{ doRender(); } finally { _rendering=false; }
  if(_dirty){ _dirty=false; render(); }
}
function doRender(){
  var root=$("#root"); if(!root) return;
  var anyStaff=Object.keys(S.staff).length>0;
  if(UNLOCKED && MODE!=="loading" && anyStaff && !me()) UNLOCKED=false;
  var fresh = MODE!=="loading" && MODE!=="revoked" && !anyStaff;
  if(!UNLOCKED && !fresh){ root.innerHTML=""; showLock(); return; }
  hideLock();
  var scrollY=window.scrollY;
  root.innerHTML="";
  root.appendChild(Header());
  if(MODE==="loading"){ root.appendChild(el("div",{class:"empty",text:"جارٍ فتح قاعدة البيانات…"})); return; }
  if(MODE==="revoked"){ root.appendChild(el("div",{class:"empty"},[
    el("h3",{text:"انتهت صلاحية الوصول"}),
    el("p",{text:"أعد تحميل الصفحة للاتصال بقاعدة البيانات من جديد."})]));
    return; }
  if(MODE==="local") root.appendChild(el("div",{class:"banner local"},[
    el("b",{text:"وضع محلي."}),
    el("span",{text:MODE_ERR
      ? ("تعذّر الاتصال بقاعدة البيانات المشتركة ("+MODE_ERR+") — البيانات محفوظة على هذا المتصفح فقط.")
      : "البيانات محفوظة على هذا المتصفح فقط ولا تصل للموظفين."}),
    el("span",{class:"spacer"}),
    el("button",{class:"btn sm",text:"ربط قاعدة البيانات",
      onclick:function(){ requireRootCode("ربط قاعدة البيانات",dbSetup); }})
  ]));

  if(!anyStaff){ root.appendChild(FirstRun()); return; }
  if(!me()){ root.innerHTML=""; UNLOCKED=false; showLock(); return; }

function applyFilters(list){
  var q=V.q.trim();
  return list.filter(function(p){
    var st=statusOf(p);
    if(V.filter!=="all" && st.k!==V.filter) return false;
    if(V.filter==="all" && !V.showDone && st.k==="done") return false;
    if(V.who!=="all" && p.assigneeId!==V.who) return false;
    if(V.mgr!=="all" && p.managerId!==V.mgr) return false;
    if(V.stage!=="all" && p.stage!==V.stage) return false;
    if(q){
      var hay=[p.name,p.code,p.client,p.type,personName(p.assigneeId)].join(" ");
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort(sortProjects);
}

function sortProjects(x,y){
  var ord={late:0,today:1,work:2,paused:3,done:4};
  var kx=statusOf(x).k, ky=statusOf(y).k;
  var dx=kx==="done"?1:0, dy=ky==="done"?1:0;
  if(dx!==dy) return dx-dy;
  var px=x.pinned?0:1, py=y.pinned?0:1;
  if(px!==py) return px-py;
  var qx=PRIO_RANK[x.priority]===undefined?2:PRIO_RANK[x.priority];
  var qy=PRIO_RANK[y.priority]===undefined?2:PRIO_RANK[y.priority];
  if(qx!==qy) return qx-qy;
  if(ord[kx]!==ord[ky]) return ord[kx]-ord[ky];
  return String(x.dueDate||"9999").localeCompare(String(y.dueDate||"9999"));
}

function TimelineView(){
  var rows=applyFilters(projList()).filter(function(p){return !!p.dueDate;});
  var wrap=el("div",{},[Toolbar()]);
  if(!rows.length){ wrap.appendChild(el("div",{class:"register"},[
    el("div",{class:"empty"},[el("h3",{text:"لا توجد مواعيد تسليم"}),
      el("p",{text:"أضف مشاريع بتواريخ تسليم لتظهر مرتّبة باليوم والتاريخ."})])])); return wrap; }
  var groups={},order=[];
  rows.forEach(function(p){ if(!groups[p.dueDate]){groups[p.dueDate]=[];order.push(p.dueDate);} groups[p.dueDate].push(p); });
  order.sort();
  var tISO=iso(today());
  order.forEach(function(k){
    var d=diffDays(k);
    var isToday=k===tISO;
    var tag = d<0 ? el("span",{class:"pill late tag",text:"متأخر "+Math.abs(d)+" يوم"})
      : isToday ? el("span",{class:"pill today tag",text:"اليوم"})
      : el("span",{class:"pill tag",text:"بعد "+d+" يوم"});
    var day=el("div",{class:"tl-day"+(isToday?" is-today":"")},[
      el("div",{class:"tl-hd"},[
        el("b",{text:DAYS[parseD(k).getDay()]}),
        el("span",{class:"dnum",text:fmtDate(k)}),
        tag
      ])
    ]);
    var items=el("div",{class:"tl-items"});
    groups[k].forEach(function(p){
      var st=statusOf(p);
      items.appendChild(el("div",{class:"tl-item"},[
        el("span",{class:"pill "+st.cls,text:p.stage}),
        el("span",{class:"p-name",text:p.name}),
        el("span",{class:"who"},[el("span",{class:"av",text:initials(personName(p.assigneeId))}),
          el("span",[el("b",{text:personName(p.assigneeId)})])]),
        el("button",{class:"btn ghost sm",text:"تفاصيل",onclick:function(){detail(p);}}),
        canEdit(p)?el("button",{class:"btn sm",text:"تنبيه",onclick:function(){alertForm(p);}}):null
      ]));
    });
    day.appendChild(items);
    wrap.appendChild(day);
  });
  return wrap;
}
