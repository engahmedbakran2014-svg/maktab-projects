/* المدة المحددة لتقديم الفكرة المبدئية والتعديل */
function briefClock(b){
  if(!b||!b.showTerms) return null;
  var days=Number(b.ideaDays)||DEF_IDEA_DAYS;
  if(!b.sentAt) return {state:"wait",cls:"pause",label:"لم تُرسل للمهندس بعد",days:days};
  var due=b.ideaDue||addWorkDays(b.sentAt,days);
  if(b.ideaDoneAt){
    var lateDone=parseD(b.ideaDoneAt)>parseD(due);
    return {state:"done",cls:lateDone?"work":"done",due:due,days:days,
      label:"قُدّمت الفكرة "+fmtDate(b.ideaDoneAt)+(lateDone?" — بعد الموعد":" — في وقتها")};
  }
  var left=workDaysLeft(due);
  var cls = left<0?"late":(left<=1?"work":"done");
  var label = left<0 ? "تأخر التقديم "+Math.abs(left)+" يوم عمل"
    : left===0 ? "اليوم آخر موعد لتقديم الفكرة"
    : "متبقٍ "+left+" يوم عمل من "+days;
  return {state:left<0?"late":"open",cls:cls,due:due,left:left,days:days,label:label};
}
function briefsLate(){
  return briefList().filter(function(b){
    var c=briefClock(b); return c&&c.state==="late"; });
}
function blankBrief(){
  return {projectId:"",clientName:"",clientPhone:"",landArea:"",buildRatio:"",
    showTerms:true,ideaDays:DEF_IDEA_DAYS,reviseDays:DEF_REVISE_DAYS,
    sentAt:"",ideaDue:"",assignedTo:"",ideaDoneAt:"",lateAlerted:false,
    floorsWanted:"",floorsAllowed:"",streetWidth:"",sketch:[],cadName:"",attachments:[],
    picks:{},boysRooms:"",boysBath:BATHOPT[0],distribution:DISTOPT[0],vertical:VERTOPT[0],
    entrance:ENTOPT[0],extra:"",condExtra:"",
    cl:{spaces:[],structure:STRUCTS[4],floors:"",hvac:HVACS[5],ext3d:false,int3d:false,
      int3dRooms:"",notes:"",filledAt:""},
    createdAt:Date.now(),updatedAt:Date.now()};
}
function allowedArea(b){
  var a=parseFloat(b.landArea), r=parseFloat(b.buildRatio);
  if(!a||!r) return null;
  return Math.round(a*(r/100)*100)/100;
}
function pickedList(b){
  var out=[]; PICKS.forEach(function(p){ if(b.picks&&b.picks[p]) out.push(p); });
  if(b.boysRooms) out.push("عدد غرف نوم الأولاد: "+b.boysRooms+" — "+(b.boysBath||BATHOPT[0]));
  return out;
}
function fileChips(arr,onDel){
  var box=el("div",{class:"thumbs"});
  (arr||[]).forEach(function(f,i){
    var isImg=!f.type||f.type.indexOf("image")===0;
    var src=f.url||("/_blob/"+f.id);
    if(isImg) box.appendChild(el("div",{class:"thumb"},[
      el("a",{href:src,target:"_blank",rel:"noopener"},[el("img",{src:src,alt:f.name||"مرفق"})]),
      onDel?el("button",{class:"x",text:"✕",title:"إزالة",onclick:function(){onDel(i);}}):null
    ]));
    else box.appendChild(el("div",{class:"filechip"},[
      el("span",{text:"📄"}),
      el("a",{href:src,target:"_blank",rel:"noopener",text:f.name||"ملف PDF"}),
      onDel?el("button",{class:"btn ghost sm danger",text:"✕",onclick:function(){onDel(i);}}):null
    ]));
  });
  if(!(arr||[]).length) box.appendChild(el("span",{class:"hint",text:"لا توجد مرفقات."}));
  return box;
}
function uploader(label,onAdd){
  var fi=el("input",{id:"up"+uid(),type:"file",accept:"image/*,.pdf,application/pdf",multiple:"multiple"});
  fi.addEventListener("change",function(){
    var fs=Array.prototype.slice.call(fi.files||[]); fi.value="";
    if(!fs.length) return;
    if(!ASSETS){ toast("رفع المرفقات غير متاح في هذا العرض",true); return; }
    toast("جارٍ رفع "+fs.length+" ملف…");
    fs.forEach(function(f){
      ASSETS.upload(f).then(function(r){
        onAdd({id:r.id,url:r.url,name:f.name,type:r.contentType||f.type||""});
      },function(e){
        var c=e&&e.code;
        toast(c==="too_large"?"حجم الملف أكبر من المسموح":
          c==="unsupported_type"?"صيغة غير مدعومة للرفع — ارفع صورة أو PDF، وسجّل ملف الأوتوكاد باسمه":
          "تعذّر رفع الملف",true);
      });
    });
  });
  return el("label",{class:"upload-lbl"},[fi,el("span",{text:label})]);
}

        el("span",{class:"hint",text:"عند الربط تُرفق المتطلبات والكروكي في ملف المشروع تلقائياً"})]),
      el("div",{class:"field"},[el("label",{text:"اسم العميل"}),cn]),
      el("div",{class:"field"},[el("label",{text:"جوال العميل"}),cp]),
      el("div",{class:"field"},[el("label",{text:"مساحة الأرض (م²)"}),la]),
      el("div",{class:"field"},[el("label",{text:"نسبة البناء (%)"}),br]),

        ASSETS?uploader("＋ رفع الكروكي (صورة / PDF)",function(f){sketch.push(f);drawSk();}):null,
        skBox,
        el("label",{style:"margin-top:8px",text:"ملف الأوتوكاد"}),cad,
        el("span",{class:"hint",text:"ملفات DWG لا تُرفع هنا — سجّل اسمها وتُحفظ داخل مجلد المشروع على جهازك"})
      ]),
      el("div",{class:"field full"},[
        el("label",{text:"مرفقات أخرى (صك، رخصة سابقة، صور الموقع…)"}),
        ASSETS?uploader("＋ رفع مرفقات",function(f){atts.push(f);drawAt();}):null, atBox
      ]),

      el("div",{class:"field"},[el("label",{text:"عدد غرف نوم الأولاد"}),bo]),
      el("div",{class:"field"},[el("label",{text:"حمامات غرف الأولاد"}),bb]),
      el("div",{class:"field"},[el("label",{text:"توزيع المتطلبات"}),ds]),
      el("div",{class:"field"},[el("label",{text:"الحركة الرأسية"}),vt]),
      el("div",{class:"field"},[el("label",{text:"مداخل الأدوار المتكررة"}),en]),
      el("div",{class:"field full"},[el("label",{text:"متطلبات إضافية (إدخال يدوي)"}),ex]),
      el("div",{class:"field full"},[el("label",{text:"اشتراطات أخرى"}),ce,
        el("span",{class:"hint",text:"الاشتراطات الثابتة مُدرجة تلقائياً في كل مشروع"})]),
      el("div",{class:"field full"},[
        el("label",{text:"المدة المحددة للتسليم"}),
        el("label",{style:"display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px"},
          [sh,el("span",{text:"إظهار مدة تقديم الفكرة والتعديل في الصفحة المرسلة للمهندس"})]),
        termsBox
      ])
    ])
  ],[
    el("button",{class:"btn primary",text:isNew?"حفظ المتطلبات":"حفظ التعديل",onclick:function(){
      var id=isNew?uid():b.id;
      var body={projectId:pj.value,clientName:cn.value.trim(),clientPhone:cp.value.trim(),
        landArea:la.value,buildRatio:br.value,streetWidth:sw.value,
        floorsWanted:fw.value.trim(),floorsAllowed:fa.value.trim(),
        sketch:sketch,cadName:cad.value.trim(),attachments:atts,

        assignedTo:b.assignedTo||"",ideaDoneAt:b.ideaDoneAt||"",lateAlerted:!!b.lateAlerted,

      put("briefs",id,body);
      closeModal(); toast("حُفظت متطلبات العميل");

/* نموذج العميل: الفراغات والمساحات ونظام الإنشاء والتكييف والمناظير */
function clientForm(b){
  var c=JSON.parse(JSON.stringify(b.cl||blankBrief().cl));
  var rows=(c.spaces||[]).slice();
  var box=el("div",{class:"picklist"});
  function draw(){
    box.innerHTML="";
    if(!rows.length) box.appendChild(el("span",{class:"hint",text:"لم تُضف فراغات بعد."}));
    rows.forEach(function(r,i){
      var nm=inp("cs"+i,r.name,{placeholder:"اسم الفراغ — مثال: مجلس رجال"});
      nm.addEventListener("input",function(){r.name=nm.value;});
      var ar=inp("ca"+i,r.area,{placeholder:"المساحة م²",type:"number",step:"0.5"});
      ar.addEventListener("input",function(){r.area=ar.value;});
      box.appendChild(el("div",{class:"pick",style:"display:grid;grid-template-columns:1.8fr 1fr auto;gap:8px;align-items:center"},[
        nm,ar,el("button",{class:"btn ghost sm danger",text:"✕",onclick:function(){rows.splice(i,1);draw();}})
      ]));
    });
  }
  draw();
  var st=sel("clSt",c.structure||STRUCTS[4],STRUCTS);
  var fl=inp("clFl",c.floors,{placeholder:"مثال: أرضي + دورين + ملحق"});
  var hv=sel("clHv",c.hvac||HVACS[5],HVACS);
  var e3=el("input",{id:"clExt3",type:"checkbox"}); e3.checked=!!c.ext3d;
  var i3=el("input",{id:"clInt3",type:"checkbox"}); i3.checked=!!c.int3d;
  var ir=inp("clInt3R",c.int3dRooms,{placeholder:"الفراغات المطلوب لها منظور داخلي"});
  var nt=el("textarea",{id:"clNotes",placeholder:"ملاحظات العميل…",style:"min-height:80px"});
  nt.value=c.notes||"";
  openModal(modal("متطلبات العميل الخاصة — "+(b.clientName||"العميل"),[
    el("p",{style:"margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.7",
      text:"هذه الصفحة تُرسل للعميل ليحدد متطلباته الخاصة، وتُسجَّل إجاباته هنا وتُرفق بملف المشروع."}),
    el("div",{class:"field full"},[
      el("label",{text:"الفراغات المطلوبة ومساحاتها الداخلية"}),box,
      el("div",{style:"display:flex;gap:7px;flex-wrap:wrap;margin-top:6px"},[
        el("button",{class:"btn sm",text:"+ إضافة فراغ",onclick:function(){
          rows.push({name:"",area:""}); draw(); }}),
        el("button",{class:"btn sm",text:"إدراج فراغات الفيلا المعتادة",onclick:function(){
          ["مجلس رجال","مجلس نساء","صالة طعام","صالة معيشة","مطبخ","منطقة طهي",
           "غرفة نوم رئيسية","غرفة نوم","غرفة خادمة","مخزن","مصلى"].forEach(function(n){
            rows.push({name:n,area:""}); }); draw(); }})
      ])
    ]),
    el("div",{class:"f-grid"},[
      el("div",{class:"field"},[el("label",{text:"نظام الإنشاء"}),st]),
      el("div",{class:"field"},[el("label",{text:"عدد الأدوار"}),fl]),
      el("div",{class:"field"},[el("label",{text:"نظام التكييف الداخلي"}),hv]),
      el("div",{class:"field"},[el("label",{text:"أعمال المناظير"}),
        el("label",{style:"display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px"},
          [e3,el("span",{text:"عمل منظور خارجي"})]),
        el("label",{style:"display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;margin-top:5px"},
          [i3,el("span",{text:"عمل منظور داخلي"})])]),
      el("div",{class:"field full"},[el("label",{text:"فراغات المنظور الداخلي"}),ir]),
      el("div",{class:"field full"},[el("label",{text:"ملاحظات العميل"}),nt])
    ])
  ],[
    el("button",{class:"btn primary",text:"حفظ إجابات العميل",onclick:function(){
      patch("briefs",b.id,{cl:{spaces:rows.filter(function(r){return r.name;}),
        structure:st.value,floors:fl.value.trim(),hvac:hv.value,
        ext3d:e3.checked,int3d:i3.checked,int3dRooms:ir.value.trim(),
        notes:nt.value.trim(),filledAt:iso(today()),filledBy:meId||""},updatedAt:Date.now()});
      closeModal(); toast("سُجّلت متطلبات العميل الخاصة");
    }}),
    el("button",{class:"btn",text:"طباعة نموذج فارغ للعميل",onclick:function(){
      closeModal(); briefSheet(b,"clientform"); }}),
    el("button",{class:"btn",text:"إلغاء",onclick:closeModal})
  ]));

/* صفحة عرض/طباعة: للفريق أو نموذج للعميل */
function briefSheet(b,mode){
  var p=b.projectId?S.projects[b.projectId]:null;
  var isForm = mode==="clientform";
  var sheet=el("div",{class:"printsheet"});
  sheet.appendChild(el("div",{class:"psheet-hd"},[
    el("b",{text:isForm?"نموذج متطلبات العميل الخاصة":"متطلبات العميل وكروكي الأرض"}),
    el("span",{text:(p?("المشروع: "+p.name+(p.code?" — رقم "+p.code:"")+" · "):"")+
      (b.clientName?"العميل: "+b.clientName+" · ":"")+fmtDate(iso(today()))})
  ]));
  function tbl(rows){ return el("table",{class:"psheet"},[el("tbody",rows.map(function(r){
    return el("tr",[el("th",{text:r[0]}),el("td",{text:r[1]})]); }))]); }

  if(!isForm){
    var aa=allowedArea(b);
    sheet.appendChild(el("h3",{class:"psub",text:"بيانات الأرض"}));
    sheet.appendChild(tbl([
      ["مساحة الأرض",(b.landArea||"—")+" م²"],
      ["نسبة البناء",(b.buildRatio||"—")+" %"],
      ["المساحة المسموح بالبناء عليها",aa?aa+" م²":"—"],
      ["عرض الشارع",(b.streetWidth||"—")+" م"],
      ["عدد الأدوار المطلوبة",b.floorsWanted||"—"],
      ["عدد الأدوار المسموح به",b.floorsAllowed||"—"]
    ]));
    if((b.sketch||[]).length){
      sheet.appendChild(el("h3",{class:"psub",text:"كروكي الأرض"}));
      sheet.appendChild(el("div",{class:"sketchbox"},(b.sketch||[]).map(function(f){
        var src=f.url||("/_blob/"+f.id);
        var isImg=!f.type||f.type.indexOf("image")===0;
        return isImg?el("img",{src:src,alt:"كروكي الأرض",class:"sketchimg"})
          :el("div",{class:"filechip"},[el("span",{text:"📄"}),
            el("a",{href:src,target:"_blank",rel:"noopener",text:f.name||"كروكي PDF"})]);
      })));
    }
    if(b.cadName) sheet.appendChild(el("p",{class:"hint",text:"ملف الأوتوكاد: "+b.cadName}));
    var pk=pickedList(b);
    sheet.appendChild(el("h3",{class:"psub",text:"متطلبات العميل"}));
    sheet.appendChild(pk.length?el("ul",{class:"plist"},pk.map(function(x){return el("li",{text:x});}))
      :el("p",{class:"hint",text:"لم تُحدَّد متطلبات جاهزة."}));
    sheet.appendChild(tbl([
      ["توزيع المتطلبات",b.distribution||"—"],
      ["الحركة الرأسية",b.vertical||"—"],
      ["مداخل الأدوار المتكررة",b.entrance||"—"]
    ]));
    if(b.extra){ sheet.appendChild(el("h3",{class:"psub",text:"متطلبات إضافية"}));
      sheet.appendChild(el("p",{class:"ptext",text:b.extra})); }
    var bc=briefClock(b);
    if(bc){
      sheet.appendChild(el("h3",{class:"psub",text:"المدة المحددة للتسليم"}));
      sheet.appendChild(tbl([

/* ===== تصدير كامل الأعمال والمشاريع (القائمة والمتوقفة) حسب الموظف ===== */
var WL={who:"all",work:true,late:true,paused:true,done:false,tasks:true};
function wlMatch(p,who){
  if(who==="all") return true;
  if(p.assigneeId===who||p.managerId===who) return true;
  if((p.team||[]).some(function(t){return t.staffId===who;})) return true;
  if((p.tasks||[]).some(function(t){return t.assigneeId===who;})) return true;
  return false;
}
function wlRows(){
  return projList().filter(function(p){
    if(!wlMatch(p,WL.who)) return false;
    var k=statusOf(p).k;
    if(k==="paused") return WL.paused;
    if(k==="done") return WL.done;
    if(k==="late"||k==="today") return WL.late;
    return WL.work;
  }).sort(sortProjects);
}
function wlProjectRow(p){
  var st=statusOf(p), a=S.staff[p.assigneeId], tk=taskList(p);
  var d=diffDays(p.dueDate);
  return {
    code:p.code||"", name:p.name||"", client:p.client||"", type:p.type||"",
    stage:p.stage||"", ws:wsOf(p),
    reason: wsOf(p)==="متوقف" ? ((p.pauseReason||"").trim()||"لم يُذكر السبب") : "—",
    status:st.label,
    lateDays:(st.k==="late"&&d!==null)?Math.abs(d):"",
    start:p.startDate||"", due:p.dueDate||"", day:p.dueDate?dayName(p.dueDate):"",
    prio:p.priority||"عادية", who:personName(p.assigneeId), phone:a?a.phone:"",
    mgr:personName(p.managerId),
    tTotal:tk.length,
    tDone:tk.filter(function(t){return t.status==="منجز";}).length,
    tWork:tk.filter(function(t){return t.status==="قيد التنفيذ";}).length,
    tNone:tk.filter(function(t){return t.status==="لم يبدأ";}).length,
    last:(projLogs(p.id)[0]||{}).date||""
  };
}

function alertForm(p,preset){
  var asg=S.staff[p.assigneeId];
  if(!asg) { toast("لم يُحدَّد موظف لهذا المشروع",true); return; }
  if(!canMessage(p.assigneeId)){
    toast("لا تملك صلاحية إرسال تنبيه لـ"+asg.name+" — صلاحيتك محصورة بـ"+
      (msgScope()==="draftsmen"?"الرسامين":"لا أحد"),true);
    return;
  }
  var stt=statusOf(p);
  var mine=me();
  var noteT=el("textarea",{id:"alNote",placeholder:"اكتب الملاحظة أو المطلوب من الموظف…"});
  noteT.value = preset || (stt.k==="late"
    ? "المشروع لم يُستكمل في الوقت المحدد. أفدني بوضع العمل الحالي وموعد الإنجاز."
    : stt.k==="today" ? "موعد تسليم المشروع اليوم. الرجاء رفع المخرجات النهائية."
    : stt.needReason ? "المشروع مسجّل كمتوقف بلا سبب. الرجاء استكمال سبب التوقف في البرنامج."
    : "");
  var box=el("div",{class:"msgbox"});
  var act=sel("alAct","تعديل",ACTIONS);
  var showTime=el("input",{id:"alTime",type:"checkbox"});
  function compose(){
    var L=[];
    L.push("السلام عليكم ورحمة الله");
    L.push("");
    L.push("إجراء المعاملة من المهندس "+asg.name);
    L.push("رقم المشروع: "+(p.code||"—"));
    L.push("اسم المشروع: "+p.name);
    L.push("الإجراء المطلوب: "+act.value);
    if(showTime.checked){
      L.push("تاريخ التسليم: "+fmtDate(p.dueDate)+" — "+dayName(p.dueDate));
      L.push("المدة: "+stt.label);
    }
    if(noteT.value.trim()){ L.push(""); L.push(noteT.value.trim()); }
    L.push("");
    L.push("وشكراً لكم — "+(mine?mine.name:""));
    return L.join("\n");
  }
  function refresh(){ box.textContent=compose(); }
  noteT.addEventListener("input",refresh);
  act.addEventListener("change",refresh);
  showTime.addEventListener("change",refresh);
  refresh();
  var phone=waPhone(asg.phone);

  openModal(modal("تنبيه "+asg.name,[
    el("div",{style:"display:flex;gap:10px;align-items:center"},[
      el("span",{class:"av",text:initials(asg.name)}),
      el("span",{style:"flex:1"},[
        el("b",{style:"display:block;font-size:14px",text:asg.name}),
        el("small",{class:"num",style:"color:var(--ink-3);font-size:12px",text:asg.phone||"لا يوجد رقم"})
      ]),
      el("span",{class:"pill "+stt.cls,text:stt.label})
    ]),
    el("div",{class:"f-grid"},[
      el("div",{class:"field"},[el("label",{text:"الإجراء المراد تقديمه"}),act]),
      el("div",{class:"field"},[el("label",{text:"المدة الزمنية"}),
        el("label",{style:"display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;padding-top:6px"},
          [showTime,el("span",{text:"ذكر المدة وتاريخ التسليم في الرسالة"})])])
    ]),
    field("الملاحظة",noteT,null,true),
    el("div",{class:"field full"},[ el("label",{text:"نص الرسالة"}), box ])
  ],[
    el("button",{class:"btn primary",text:"تسجيل التنبيه في البرنامج",onclick:function(){
      var id=uid();
      put("notes",id,{projectId:p.id,text:noteT.value.trim()||stt.label,fromId:meId||"",toId:p.assigneeId,
        kind:"alert",createdAt:Date.now(),readAt:null});
      closeModal(); toast("تم تسجيل التنبيه — سيظهر لـ"+asg.name+" عند فتح البرنامج");
    }}),
    phone?el("a",{class:"btn",href:"https://wa.me/"+phone+"?text="+encodeURIComponent(compose()),
      target:"_blank",rel:"noopener",style:"text-decoration:none",text:"فتح واتساب",onclick:function(){
        var id=uid();
        put("notes",id,{projectId:p.id,text:noteT.value.trim()||stt.label,fromId:meId||"",toId:p.assigneeId,
          kind:"alert",createdAt:Date.now(),readAt:null});

/* ============ rendering ============ */
var _rendering=false,_dirty=false;
function render(){
  if(_rendering){ _dirty=true; return; }      /* يمنع تكرار القوائم عند تداخل التحديثات */
  _rendering=true;
  try{ doRender(); } finally { _rendering=false; }
  if(_dirty){ _dirty=false; render(); }
}
function doRender(){
  var root=$("#root"); if(!root) return;
  var anyStaff=Object.keys(S.staff).length>0;
  if(UNLOCKED && MODE!=="loading" && anyStaff && !me()) UNLOCKED=false;
  if(needsLink()){ root.innerHTML=""; UNLOCKED=false; showLock(); return; }

function applyFilters(list){
  var q=V.q.trim();
  return list.filter(function(p){
    var st=statusOf(p);
    if(V.filter!=="all" && st.k!==V.filter) return false;
    if(V.filter==="all" && !V.showDone && st.k==="done") return false;
    if(V.who!=="all" && p.assigneeId!==V.who) return false;
    if(V.mgr!=="all" && p.managerId!==V.mgr) return false;
    if(V.stage!=="all" && p.stage!==V.stage) return false;
    if(q){
      var hay=[p.name,p.code,p.client,p.type,personName(p.assigneeId)].join(" ");
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort(sortProjects);
}

function sortProjects(x,y){
  var ord={late:0,today:1,work:2,paused:3,done:4};
  var kx=statusOf(x).k, ky=statusOf(y).k;
  var dx=kx==="done"?1:0, dy=ky==="done"?1:0;
  if(dx!==dy) return dx-dy;
  var px=x.pinned?0:1, py=y.pinned?0:1;
  if(px!==py) return px-py;
  var qx=PRIO_RANK[x.priority]===undefined?2:PRIO_RANK[x.priority];
  var qy=PRIO_RANK[y.priority]===undefined?2:PRIO_RANK[y.priority];
  if(qx!==qy) return qx-qy;
  if(ord[kx]!==ord[ky]) return ord[kx]-ord[ky];
  return String(x.dueDate||"9999").localeCompare(String(y.dueDate||"9999"));
}

function TimelineView(){
  var rows=applyFilters(projList()).filter(function(p){return !!p.dueDate;});
  var wrap=el("div",{},[Toolbar()]);
  if(!rows.length){ wrap.appendChild(el("div",{class:"register"},[
    el("div",{class:"empty"},[el("h3",{text:"لا توجد مواعيد تسليم"}),
      el("p",{text:"أضف مشاريع بتواريخ تسليم لتظهر مرتّبة باليوم والتاريخ."})])])); return wrap; }
  var groups={},order=[];
  rows.forEach(function(p){ if(!groups[p.dueDate]){groups[p.dueDate]=[];order.push(p.dueDate);} groups[p.dueDate].push(p); });
  order.sort();
  var tISO=iso(today());
  order.forEach(function(k){
    var d=diffDays(k);
    var isToday=k===tISO;
    var tag = d<0 ? el("span",{class:"pill late tag",text:"متأخر "+Math.abs(d)+" يوم"})
      : isToday ? el("span",{class:"pill today tag",text:"اليوم"})
      : el("span",{class:"pill tag",text:"بعد "+d+" يوم"});
    var day=el("div",{class:"tl-day"+(isToday?" is-today":"")},[
      el("div",{class:"tl-hd"},[
        el("b",{text:DAYS[parseD(k).getDay()]}),
        el("span",{class:"dnum",text:fmtDate(k)}),
        tag
      ])
    ]);
    var items=el("div",{class:"tl-items"});
    groups[k].forEach(function(p){
      var st=statusOf(p);
      items.appendChild(el("div",{class:"tl-item"},[
        el("span",{class:"pill "+st.cls,text:p.stage}),
        el("span",{class:"p-name",text:p.name}),
        el("span",{class:"who"},[el("span",{class:"av",text:initials(personName(p.assigneeId))}),
          el("span",[el("b",{text:personName(p.assigneeId)})])]),
        el("button",{class:"btn ghost sm",text:"تفاصيل",onclick:function(){detail(p);}}),
        canEdit(p)?el("button",{class:"btn sm",text:"تنبيه",onclick:function(){alertForm(p);}}):null
      ]));
    });
    day.appendChild(items);
    wrap.appendChild(day);
  });
  return wrap;
}
